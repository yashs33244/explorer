<svg class="hd" viewBox="0 0 800 628" role="img" aria-label="Service blueprint for self-serve Postgres provisioning: user actions, the console frontstage, the control plane backstage and the infrastructure that supports it, split by the lines of interaction, visibility and internal interaction" xmlns="http://www.w3.org/2000/svg">
