<svg class="hd" viewBox="0 0 800 660" role="img" aria-label="Frayer model for idempotency: a definition, its characteristics, real examples such as Stripe idempotency keys and Postgres upserts, and non-examples such as a retried payment without a key" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="frayer-model-d1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
