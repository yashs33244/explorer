<text class="d-k" x="50" y="58">What it is</text>
<text class="d-h" x="50" y="80">Definition</text>
<text class="d-t" x="50" y="112">Repeating a request has the</text>
<text class="d-t" x="50" y="132">same effect as sending it once.</text>
<rect class="d-box" x="50" y="150" width="326" height="56" rx="10"/>
<text class="d-m" x="66" y="174">f(f(x)) = f(x)</text>
<text class="d-s" x="66" y="194">retried 3 times, still 1 order</text>
<rect class="d-tag" x="50" y="224" width="66" height="24" rx="12"/>
<text class="d-s" x="83" y="240" text-anchor="middle">try 1</text>
<rect class="d-tag" x="122" y="224" width="66" height="24" rx="12"/>
<text class="d-s" x="155" y="240" text-anchor="middle">try 2</text>
<rect class="d-tag" x="194" y="224" width="66" height="24" rx="12"/>
<text class="d-s" x="227" y="240" text-anchor="middle">try 3</text>
<path class="d-edge acc" d="M266,236 H296" marker-end="url(#frayer-model-d1-ah)"/>
<rect class="d-tag acc" x="302" y="224" width="74" height="24" rx="12"/>
<text class="d-s" x="339" y="240" text-anchor="middle">1 row</text>
<text class="d-k" x="750" y="58" text-anchor="end">How to spot it</text>
<text class="d-h" x="750" y="80" text-anchor="end">Characteristics</text>
<circle class="d-fillacc" cx="430" cy="106" r="4"/>
<text class="d-t" x="444" y="111">Client sends an Idempotency-Key</text>
<circle class="d-fillacc" cx="430" cy="136" r="4"/>
<text class="d-t" x="444" y="141">Server stores key and response</text>
<circle class="d-fillacc" cx="430" cy="166" r="4"/>
<text class="d-t" x="444" y="171">Retry replays the stored result</text>
<circle class="d-fillacc" cx="430" cy="196" r="4"/>
<text class="d-t" x="444" y="201">Keys expire after a TTL (24h)</text>
<circle class="d-fillacc" cx="430" cy="226" r="4"/>
<text class="d-t" x="444" y="231">Safe under at-least-once delivery</text>
<text class="d-m" x="444" y="260">same key, new body: 422</text>
<path class="d-box g0" d="M315,295 H485 A35,35 0 0 1 485,365 H315 A35,35 0 0 1 315,295 Z"/>
<text class="d-k" x="400" y="317" text-anchor="middle">Concept</text>
<text class="d-h" x="400" y="339" text-anchor="middle">Idempotency</text>
<text class="d-s" x="400" y="356" text-anchor="middle">safe to retry</text>
<text class="d-k" x="50" y="362">It is</text>
<text class="d-h" x="50" y="384">Examples</text>
