<text class="d-h" x="104" y="162">Key concepts</text>
<text class="d-t" x="104" y="192">CAP theorem</text>
<text class="d-s" x="104" y="208">pick C or A in a partition</text>
<text class="d-t" x="104" y="236">Consistent hashing</text>
<text class="d-s" x="104" y="252">add a node, move 1/N keys</text>
