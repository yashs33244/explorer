<text class="d-s" x="376" y="95" text-anchor="end">role and bar</text>
<text class="d-t" x="54" y="132">Senior Backend Engineer, Payments</text>
<text class="d-s" x="54" y="152">Bar: owns a service from design to on-call</text>
<text class="d-k" x="54" y="178">Stack to revise</text>
