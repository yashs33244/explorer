<svg class="hd" viewBox="0 0 800 724" role="img" aria-label="Interview cheat sheet for a senior backend engineer onsite loop on a payments team: a candidate brief with the Go, PostgreSQL, Kafka and AWS stack, questions to ask the interviewers, and four round cards for coding, system design, production debugging and behavioral, each with key questions and the signal interviewers look for" xmlns="http://www.w3.org/2000/svg">
<text class="d-k" x="40" y="30">Interview cheat sheet</text>
<text class="d-h" x="40" y="54">Backend onsite loop, Payments platform</text>
<text class="d-m" x="760" y="30" text-anchor="end">4 rounds, 3h 30m</text>
<text class="d-s" x="760" y="54" text-anchor="end">read the night before</text>
