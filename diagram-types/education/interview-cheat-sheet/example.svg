<image class="d-logo" data-logo="aws.amazon.com" data-name="AWS" x="290" y="188" width="22" height="22"/>
<text class="d-s" x="318" y="204">AWS</text>
<text class="d-k" x="414" y="88">Questions to ask them</text>
<rect class="d-note g2" x="414" y="100" width="106" height="110" rx="4"/>
<text class="d-tn" x="467" y="141" text-anchor="middle">On-call load</text>
<text class="d-tn" x="467" y="159" text-anchor="middle">per engineer?</text>
<rect class="d-note g2" x="532" y="100" width="106" height="110" rx="4"/>
<text class="d-tn" x="585" y="132" text-anchor="middle">How are</text>
<text class="d-tn" x="585" y="150" text-anchor="middle">incidents</text>
<text class="d-tn" x="585" y="168" text-anchor="middle">reviewed?</text>
<rect class="d-note g2" x="650" y="100" width="106" height="110" rx="4"/>
<text class="d-tn" x="703" y="132" text-anchor="middle">Deploys per</text>
<text class="d-tn" x="703" y="150" text-anchor="middle">day, and who</text>
<text class="d-tn" x="703" y="168" text-anchor="middle">can roll back?</text>
<rect class="d-lane" x="40" y="244" width="350" height="220" rx="10"/>
<rect class="d-band g0" x="40" y="244" width="350" height="36" rx="10"/>
<text class="d-t" x="54" y="267">Coding</text>
<text class="d-s" x="376" y="267" text-anchor="end">60 min, live in Go</text>
<text class="d-k" x="54" y="304">Key questions</text>
<circle class="d-fill g0" cx="59" cy="324" r="4"/>
<text class="d-s" x="72" y="328">Rate limiter: token bucket, thread safe</text>
<circle class="d-fill g0" cx="59" cy="348" r="4"/>
<text class="d-s" x="72" y="352">LRU cache with O(1) get and put</text>
<circle class="d-fill g0" cx="59" cy="372" r="4"/>
<text class="d-s" x="72" y="376">Merge overlapping maintenance windows</text>
<circle class="d-fill g0" cx="59" cy="396" r="4"/>
<text class="d-s" x="72" y="400">Dedupe webhooks by idempotency key</text>
<path class="d-grid" d="M54,424 H376"/>
<text class="d-k" x="54" y="448">Signal</text>
<text class="d-m" x="112" y="448">tests first, edge cases out loud</text>
<rect class="d-lane" x="410" y="244" width="350" height="220" rx="10"/>
<rect class="d-band g4" x="410" y="244" width="350" height="36" rx="10"/>
