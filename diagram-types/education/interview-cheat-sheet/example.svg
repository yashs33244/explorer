<circle class="d-fill g4" cx="429" cy="324" r="4"/>
<text class="d-s" x="442" y="328">Design a double-entry payments ledger</text>
<circle class="d-fill g4" cx="429" cy="348" r="4"/>
<text class="d-s" x="442" y="352">Outbox table plus idempotent consumer</text>
<circle class="d-fill g4" cx="429" cy="372" r="4"/>
<text class="d-s" x="442" y="376">Shard PostgreSQL by merchant_id</text>
<circle class="d-fill g4" cx="429" cy="396" r="4"/>
<text class="d-s" x="442" y="400">Safe retries on POST /charges</text>
<path class="d-grid" d="M424,424 H746"/>
<text class="d-k" x="424" y="448">Signal</text>
<text class="d-m" x="482" y="448">numbers first: 5k TPS, p99 200ms</text>
<rect class="d-lane" x="40" y="484" width="350" height="220" rx="10"/>
<rect class="d-band g5" x="40" y="484" width="350" height="36" rx="10"/>
<text class="d-t" x="54" y="507">Production debugging</text>
<text class="d-s" x="376" y="507" text-anchor="end">45 min, live dashboards</text>
<text class="d-k" x="54" y="544">Key questions</text>
<circle class="d-fill g5" cx="59" cy="564" r="4"/>
<text class="d-s" x="72" y="568">p99 doubles after a deploy: look where?</text>
<circle class="d-fill g5" cx="59" cy="588" r="4"/>
<text class="d-s" x="72" y="592">DB connection pool exhausted at peak</text>
<circle class="d-fill g5" cx="59" cy="612" r="4"/>
<text class="d-s" x="72" y="616">Consumer lag on one Kafka partition</text>
<circle class="d-fill g5" cx="59" cy="636" r="4"/>
<text class="d-s" x="72" y="640">Read a flame graph and a query plan</text>
<path class="d-grid" d="M54,664 H376"/>
<text class="d-k" x="54" y="688">Signal</text>
<text class="d-m" x="112" y="688">hypothesis, evidence, then rollback</text>
<rect class="d-lane" x="410" y="484" width="350" height="220" rx="10"/>
<rect class="d-band g3" x="410" y="484" width="350" height="36" rx="10"/>
<text class="d-t" x="424" y="507">Behavioral</text>
<text class="d-s" x="746" y="507" text-anchor="end">45 min, hiring manager</text>
<text class="d-k" x="424" y="544">Key questions</text>
<circle class="d-fill g3" cx="429" cy="564" r="4"/>
<text class="d-s" x="442" y="568">An incident you owned end to end</text>
<circle class="d-fill g3" cx="429" cy="588" r="4"/>
<text class="d-s" x="442" y="592">You disagreed with a design: then?</text>
<circle class="d-fill g3" cx="429" cy="612" r="4"/>
<text class="d-s" x="442" y="616">Cut scope to hit a launch date</text>
<circle class="d-fill g3" cx="429" cy="636" r="4"/>
<text class="d-s" x="442" y="640">Brought a new hire onto on-call</text>
<path class="d-grid" d="M424,664 H746"/>
<text class="d-k" x="424" y="688">Signal</text>
<text class="d-m" x="482" y="688">owns outcome, quantifies impact</text>
