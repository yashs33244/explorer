<text class="d-s" x="159" y="514" text-anchor="middle">time to 10th PR: 41d to 19d</text>
<rect class="d-tag" x="290" y="494" width="230" height="30" rx="15"/>
<text class="d-s" x="405" y="514" text-anchor="middle">change failure rate: 18% to 9%</text>
