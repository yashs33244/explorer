<svg class="hd" viewBox="0 0 800 566" role="img" aria-label="Outcome map for a developer education program: three activities, codebase tours, pairing on a first PR and incident game days, each lead to a countable output and a behavior outcome, which add up to the impact of new engineers shipping safely in their first week" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="outcome-mapping-d1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
