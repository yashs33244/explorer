<text class="d-t" x="92" y="263" text-anchor="middle">program</text>
<text class="d-s" x="92" y="281" text-anchor="middle">40 new hires</text>
<path class="d-edge" d="M160,256 C178,256 176,166 194,166" marker-end="url(#outcome-mapping-d1-ah)"/>
<path class="d-edge" d="M160,256 H194" marker-end="url(#outcome-mapping-d1-ah)"/>
<path class="d-edge" d="M160,256 C178,256 176,346 194,346" marker-end="url(#outcome-mapping-d1-ah)"/>

<!-- row 1 -->
<rect class="d-box g3" x="196" y="132" width="170" height="68" rx="12"/>
<text class="d-t" x="281" y="161" text-anchor="middle">Codebase tours</text>
