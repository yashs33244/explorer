<rect class="d-box g3" x="596" y="132" width="164" height="68" rx="12"/>
<text class="d-t" x="678" y="161" text-anchor="middle">Self-serve answers</text>
<text class="d-s" x="678" y="181" text-anchor="middle">#help-eng asks -40%</text>

<!-- row 2 -->
<rect class="d-box g4" x="196" y="222" width="170" height="68" rx="12"/>
<text class="d-t" x="281" y="251" text-anchor="middle">Pair on first PR</text>
<text class="d-s" x="281" y="271" text-anchor="middle">senior + new hire</text>
