<path class="d-edge" d="M366,166 H394" marker-end="url(#outcome-mapping-d1-ah)"/>
<rect class="d-box g3" x="396" y="132" width="170" height="68" rx="12"/>
<image class="d-logo" data-logo="loom.com" data-name="Loom" x="408" y="156" width="20" height="20"/>
