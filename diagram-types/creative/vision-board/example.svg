<svg class="hd" viewBox="0 0 800 740" role="img" aria-label="Vision board for the platform team in 2027: a headline goal over a mosaic of tiles for deploy frequency, a golden path from template to production, quiet on-call, latency and availability targets, a 30 percent cloud cost cut, retiring Jenkins and tracing every service" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="vision-board-d1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
