<path class="d-line" d="M414,162 C424,176 442,176 452,160"/>
<text class="d-k" x="492" y="136">To</text>
<text class="d-h" x="492" y="160">Priya N.</text>
<text class="d-s" x="492" y="180">Incident commander</text>
<path class="d-fillpaper" d="M394,214 C396,224 397,225 406,227 C397,229 396,230 394,240 C392,230 391,229 382,227 C391,225 392,224 394,214 Z"/>
<text class="d-t" x="420" y="232">Called the rollback at</text>
<text class="d-t" x="420" y="252">minute 6 and kept the</text>
<text class="d-t" x="420" y="272">bridge calm. Thank you!</text>
<path class="d-grid" d="M396,330 H664"/>
<circle class="d-fill g3" cx="410" cy="330" r="7"/>
<circle class="d-fill g2" cx="530" cy="330" r="7"/>
