<svg class="hd" viewBox="0 0 800 570" role="img" aria-label="Family tree of PostgreSQL: Berkeley Postgres begat PostgreSQL, which was forked into MPP warehouses, scale-out extensions and cloud storage rewrites, some later relicensed or acquired" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="family-tree-d1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
  <rect class="d-blob" x="12" y="62" width="776" height="436" rx="18"/>
  <text class="d-k" x="30" y="48">Origin</text>
  <text class="d-k" x="170" y="48">Open source</text>
  <text class="d-k" x="345" y="48">Forks and rewrites</text>
  <text class="d-k" x="590" y="48">Descendants</text>
  <path id="family-tree-d1-root" class="d-box g0" d="M90,218 L152,280 L90,342 L28,280 Z"/>
  <text class="d-t" x="90" y="274" text-anchor="middle">Postgres</text>
  <text class="d-s" x="90" y="291" text-anchor="middle">UC Berkeley</text>
  <text class="d-s" x="90" y="307" text-anchor="middle">1986</text>
  <path class="d-edge" d="M152,280 L172,280"/>
  <rect id="family-tree-d1-pg" class="d-box g0" x="172" y="248" width="138" height="64" rx="10"/>
  <image class="d-logo" data-logo="postgresql.org" data-name="PostgreSQL" x="182" y="267" width="26" height="26"/>
  <text class="d-t" x="216" y="276">PostgreSQL</text><text class="d-s" x="216" y="294">1996, renamed</text>
  <path class="d-edge" d="M310,280 L326,280 M326,110 L326,460"/>
  <path class="d-edge" d="M326,110 L340,110"/>
  <rect id="family-tree-d1-netezza" class="d-box g1" x="340" y="83" width="190" height="54" rx="10"/>
  <image class="d-logo" data-logo="ibm.com" data-name="Netezza" x="350" y="97" width="26" height="26"/>
  <text class="d-t" x="386" y="107">Netezza</text><text class="d-s" x="386" y="124">2000, MPP appliance</text>
  <path class="d-edge" d="M326,180 L340,180"/>
  <rect id="family-tree-d1-greenplum" class="d-box g1" x="340" y="153" width="190" height="54" rx="10"/>
  <image class="d-logo" data-logo="greenplum.org" data-name="Greenplum" x="350" y="167" width="26" height="26"/>
  <text class="d-t" x="386" y="177">Greenplum</text><text class="d-s" x="386" y="194">2005, MPP warehouse</text>
  <path class="d-edge" d="M530,180 L586,180" marker-end="url(#family-tree-d1-ah)"/>
  <text class="d-lab" x="558" y="172" text-anchor="middle">forked</text>
  <rect id="family-tree-d1-cloudberry" class="d-box g1" x="590" y="153" width="186" height="54" rx="10"/>
  <image class="d-logo" data-logo="apache.org" data-name="Apache Cloudberry" x="600" y="167" width="26" height="26"/>
  <text class="d-t" x="636" y="177">Apache Cloudberry</text><text class="d-s" x="636" y="194">2023, open fork</text>
  <path class="d-edge" d="M326,250 L340,250"/>
  <rect id="family-tree-d1-paraccel" class="d-box g1" x="340" y="223" width="190" height="54" rx="10"/>
  <image class="d-logo" data-logo="actian.com" data-name="ParAccel" x="350" y="237" width="26" height="26"/>
  <text class="d-t" x="386" y="247">ParAccel</text><text class="d-s" x="386" y="264">2005, columnar MPP</text>
  <path class="d-edge dash" d="M530,250 L586,250" marker-end="url(#family-tree-d1-ah)"/>
  <text class="d-lab" x="558" y="242" text-anchor="middle">licensed</text>
  <rect id="family-tree-d1-redshift" class="d-box g1" x="590" y="223" width="186" height="54" rx="10"/>
  <image class="d-logo" data-logo="aws.amazon.com" data-name="Amazon Redshift" x="600" y="237" width="26" height="26"/>
  <text class="d-t" x="636" y="247">Amazon Redshift</text><text class="d-s" x="636" y="264">2012, managed DW</text>
  <path class="d-edge" d="M326,320 L340,320"/>
  <rect id="family-tree-d1-citus" class="d-box g2" x="340" y="293" width="190" height="54" rx="10"/>
  <image class="d-logo" data-logo="citusdata.com" data-name="Citus" x="350" y="307" width="26" height="26"/>
  <text class="d-t" x="386" y="317">Citus</text><text class="d-s" x="386" y="334">2011, sharding ext</text>
  <path class="d-edge dash" d="M530,320 L586,320" marker-end="url(#family-tree-d1-ah)"/>
  <text class="d-lab" x="558" y="312" text-anchor="middle">acquired</text>
  <rect id="family-tree-d1-cosmos" class="d-box g2" x="590" y="293" width="186" height="54" rx="10"/>
  <image class="d-logo" data-logo="microsoft.com" data-name="Cosmos DB for PG" x="600" y="307" width="26" height="26"/>
  <text class="d-t" x="636" y="317">Cosmos DB for PG</text><text class="d-s" x="636" y="334">2022, Azure service</text>
  <path class="d-edge" d="M326,390 L340,390"/>
  <rect id="family-tree-d1-aurora" class="d-box g3" x="340" y="363" width="190" height="54" rx="10"/>
  <image class="d-logo" data-logo="aws.amazon.com" data-name="Aurora PostgreSQL" x="350" y="377" width="26" height="26"/>
  <text class="d-t" x="386" y="387">Aurora PostgreSQL</text><text class="d-s" x="386" y="404">2017, log storage</text>
  <path class="d-edge" d="M326,460 L340,460"/>
  <rect id="family-tree-d1-neon" class="d-box g3" x="340" y="433" width="190" height="54" rx="10"/>
  <image class="d-logo" data-logo="neon.tech" data-name="Neon" x="350" y="447" width="26" height="26"/>
  <text class="d-t" x="386" y="457">Neon</text><text class="d-s" x="386" y="474">2022, branchable</text>
  <path class="d-edge dash" d="M530,460 L586,460" marker-end="url(#family-tree-d1-ah)"/>
  <text class="d-lab" x="558" y="452" text-anchor="middle">acquired</text>
  <rect id="family-tree-d1-lakebase" class="d-box g3" x="590" y="433" width="186" height="54" rx="10"/>
  <image class="d-logo" data-logo="databricks.com" data-name="Databricks Lakebase" x="600" y="447" width="26" height="26"/>
  <text class="d-t" x="636" y="457">Databricks Lakebase</text><text class="d-s" x="636" y="474">2025, lakehouse OLTP</text>
  <rect class="d-box g1" x="20" y="518" width="18" height="18" rx="4"/><text class="d-s" x="46" y="532">MPP warehouse fork</text>
  <rect class="d-box g2" x="190" y="518" width="18" height="18" rx="4"/><text class="d-s" x="216" y="532">scale-out extension</text>
  <rect class="d-box g3" x="360" y="518" width="18" height="18" rx="4"/><text class="d-s" x="386" y="532">cloud storage rewrite</text>
  <path class="d-edge dash" d="M540,527 L570,527" marker-end="url(#family-tree-d1-ah)"/><text class="d-s" x="578" y="532">licensed or acquired</text>
  <text class="d-s" x="20" y="556">Solid line: code forked from the parent. One column per generation.</text>
</svg>
