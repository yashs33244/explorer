<svg class="hd" viewBox="0 0 800 660" role="img" aria-label="Pedigree chart of Log4Shell across three release generations: v1 releases built on log4j 2.14.1 are affected, v2 releases on log4j 2.15.0 carry a shaded vulnerable copy, v3 on log4j 2.17.1 is clean" xmlns="http://www.w3.org/2000/svg">
