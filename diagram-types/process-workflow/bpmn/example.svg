<svg class="hd" viewBox="0 0 800 550" role="img" aria-label="BPMN diagram of a v2.8 release across three pools, Engineering, CI pipeline and QA: cut branch, tag a release candidate, build and deploy to staging, regression, a pass or fail gateway, sign-off and promote to production" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="bpmn-d1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>

  <!-- pools -->
  <rect class="d-lanehead g0" x="20" y="34" width="40" height="166"/>
  <rect class="d-lane" x="60" y="34" width="720" height="166"/>
  <rect class="d-lanehead g2" x="20" y="216" width="40" height="120"/>
  <rect class="d-lane" x="60" y="216" width="720" height="120"/>
  <rect class="d-lanehead g4" x="20" y="352" width="40" height="140"/>
  <rect class="d-lane" x="60" y="352" width="720" height="140"/>
  <text class="d-t" x="40" y="117" text-anchor="middle" transform="rotate(-90 40 117)">Engineering</text>
  <text class="d-t" x="40" y="276" text-anchor="middle" transform="rotate(-90 40 276)">CI pipeline</text>
  <text class="d-t" x="40" y="422" text-anchor="middle" transform="rotate(-90 40 422)">QA</text>
  <image class="d-logo" data-logo="github.com" data-name="GitHub" x="70" y="44" width="18" height="18"/>
  <image class="d-logo" data-logo="github.com" data-name="GitHub Actions" x="70" y="226" width="18" height="18"/>
  <image class="d-logo" data-logo="cypress.io" data-name="Cypress" x="70" y="362" width="18" height="18"/>

  <!-- sequence flows (solid, inside a pool) -->
  <path class="d-edge" d="M106,100 H123" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M221,100 H243" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M515,72 V54 H293 V70" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M671,100 H696" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M341,100 H376" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M422,100 H465" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M400,122 V160 H600 V131" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M341,276 H363" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M219,276 H243" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M461,276 H474" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M334,432 H351" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M671,432 H696" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M461,432 H487" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M541,432 H573" marker-end="url(#bpmn-d1-ah)"/>

  <!-- message flows (dashed, between pools) -->
  <path class="d-edge dash" d="M280,128 V200 H205 V259" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge dash" d="M395,304 V384 H320 V415" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge" d="M515,406 V390" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge dash" d="M515,364 V130" marker-end="url(#bpmn-d1-ah)"/>
  <path class="d-edge dash" d="M623,404 V130" marker-end="url(#bpmn-d1-ah)"/>

  <text class="d-lab" x="404" y="58" text-anchor="middle">retag rc2</text>
  <text class="d-lab" x="286" y="176">push tag</text>
  <text class="d-lab" x="402" y="364">staging ready</text>
  <text class="d-lab" x="521" y="250">blockers filed</text>
  <text class="d-lab" x="521" y="402">fail</text>
  <text class="d-lab" x="557" y="424" text-anchor="middle">pass</text>
  <text class="d-lab" x="629" y="190">approved</text>

  <!-- Engineering -->
  <circle class="d-fillpaper" cx="92" cy="100" r="14"/>
  <text class="d-s" x="92" y="134" text-anchor="middle">code</text>
  <text class="d-s" x="92" y="148" text-anchor="middle">freeze</text>
  <rect class="d-box g0" x="125" y="72" width="96" height="56" rx="12"/>
  <text class="d-t" x="135" y="97">Cut branch</text>
  <text class="d-s" x="135" y="115">release/2.8</text>
  <rect class="d-box g0" x="245" y="72" width="96" height="56" rx="12"/>
  <text class="d-t" x="255" y="97">Tag RC</text>
  <text class="d-s" x="255" y="115">v2.8.0-rc1</text>
  <rect class="d-box g0" x="467" y="72" width="96" height="56" rx="12"/>
  <text class="d-t" x="477" y="97">Fix bugs</text>
  <text class="d-s" x="477" y="115">hotfix PRs</text>
  <rect class="d-box g0" x="575" y="72" width="96" height="56" rx="12"/>
  <text class="d-t" x="585" y="97">Promote</text>
  <text class="d-s" x="585" y="115">canary 10%</text>
  <circle class="d-fillpaper" cx="712" cy="100" r="14"/>
  <circle class="d-edge thick" cx="712" cy="100" r="12"/>
  <text class="d-s" x="712" y="134" text-anchor="middle">v2.8 live</text>
  <polygon class="d-box g0" points="400,78 422,100 400,122 378,100"/>
  <circle class="d-line" cx="400" cy="100" r="9"/>
  <circle class="d-line" cx="400" cy="100" r="6.5"/>
  <text class="d-s" x="408" y="150">QA verdict?</text>

  <!-- CI pipeline -->
  <rect class="d-box g2" x="245" y="248" width="96" height="56" rx="12"/>
  <text class="d-t" x="255" y="273">CI build</text>
  <text class="d-s" x="255" y="291">unit + lint</text>
  <rect class="d-box g2" x="365" y="248" width="96" height="56" rx="12"/>
  <text class="d-t" x="375" y="273">Deploy</text>
  <text class="d-s" x="375" y="291">to staging</text>

  <circle class="d-fillpaper" cx="205" cy="276" r="14"/>
  <path class="d-line" d="M198,272 H212 V281 H198 Z M198,272 L205,277 L212,272"/>
  <circle class="d-fillpaper" cx="490" cy="276" r="14"/>
  <circle class="d-edge thick" cx="490" cy="276" r="12"/>

  <!-- QA -->
  <circle class="d-fillpaper" cx="320" cy="432" r="14"/>
  <path class="d-line" d="M313,428 H327 V437 H313 Z M313,428 L320,433 L327,428"/>
  <circle class="d-fillpaper" cx="712" cy="432" r="14"/>
  <circle class="d-edge thick" cx="712" cy="432" r="12"/>
  <rect class="d-box g4" x="353" y="404" width="108" height="56" rx="12"/>
  <text class="d-t" x="363" y="429">Regression</text>
  <text class="d-s" x="363" y="447">412 e2e tests</text>
  <polygon class="d-box g4" points="515,406 541,432 515,458 489,432"/>
  <path class="d-line" d="M507,424 L523,440 M523,424 L507,440"/>
  <text class="d-s" x="515" y="478" text-anchor="middle">all green?</text>
  <circle class="d-fillpaper" cx="515" cy="376" r="12"/>
  <circle class="d-edge thick" cx="515" cy="376" r="11"/>
  <path class="d-line" d="M508,372 H522 V381 H508 Z M508,372 L515,377 L522,372"/>
  <rect class="d-box g4" x="575" y="404" width="96" height="56" rx="12"/>
  <text class="d-t" x="585" y="429">Sign off</text>
  <text class="d-s" x="585" y="447">QA approval</text>

  <!-- legend -->
  <circle class="d-fillpaper" cx="74" cy="524" r="9"/>
  <text class="d-s" x="90" y="528">start event</text>
  <circle class="d-fillpaper" cx="184" cy="524" r="9"/>
  <circle class="d-edge thick" cx="184" cy="524" r="8"/>
  <text class="d-s" x="200" y="528">end event</text>
  <polygon class="d-box g4" points="290,514 300,524 290,534 280,524"/>
  <text class="d-s" x="308" y="528">gateway</text>
  <path class="d-edge" d="M374,524 H410" marker-end="url(#bpmn-d1-ah)"/>
  <text class="d-s" x="418" y="528">sequence flow</text>
  <path class="d-edge dash" d="M518,524 H554" marker-end="url(#bpmn-d1-ah)"/>
  <text class="d-s" x="562" y="528">message flow, across pools</text>
</svg>
