<svg class="hd" viewBox="0 0 800 510" role="img" aria-label="Cross-functional flowchart of a SEV2 checkout-api incident moving across Support, On-call engineer, SRE and Comms lanes, from ticket spike to rollback or database failover, SLO check and resolution" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="cross-functional-flowchart-d1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>

  <text class="d-k" x="20" y="30">SEV2 incident: checkout-api 5xx spike</text>
  <text class="d-s" x="780" y="30" text-anchor="end">time flows left to right</text>

  <!-- lanes -->
  <rect class="d-lane" x="116" y="46" width="664" height="110"/>
  <rect class="d-lane alt" x="116" y="156" width="664" height="110"/>
  <rect class="d-lane" x="116" y="266" width="664" height="110"/>
  <rect class="d-lane alt" x="116" y="376" width="664" height="110"/>
  <rect class="d-lanehead g0" x="20" y="46" width="96" height="110"/>
  <rect class="d-lanehead g1" x="20" y="156" width="96" height="110"/>
  <rect class="d-lanehead g2" x="20" y="266" width="96" height="110"/>
  <rect class="d-lanehead g3" x="20" y="376" width="96" height="110"/>
  <text class="d-t" x="32" y="98">Support</text>
  <text class="d-s" x="32" y="116">L1 desk</text>
  <text class="d-t" x="32" y="208">On-call</text>
  <text class="d-s" x="32" y="226">engineer</text>
  <text class="d-t" x="32" y="318">SRE</text>
  <text class="d-s" x="32" y="336">platform team</text>
  <text class="d-t" x="32" y="428">Comms</text>
  <text class="d-s" x="32" y="446">incident lead</text>

  <!-- edges -->
  <path class="d-edge" d="M240,101 H255" marker-end="url(#cross-functional-flowchart-d1-ah)"/>
  <path class="d-edge" d="M315,129 V181" marker-end="url(#cross-functional-flowchart-d1-ah)"/>
  <path class="d-edge" d="M373,211 H392" marker-end="url(#cross-functional-flowchart-d1-ah)"/>
  <path class="d-edge acc" d="M490,211 H521" marker-end="url(#cross-functional-flowchart-d1-ah)"/>
  <path class="d-edge" d="M442,257 V321 H521" marker-end="url(#cross-functional-flowchart-d1-ah)"/>
  <path class="d-edge acc" d="M639,211 H714 V291" marker-end="url(#cross-functional-flowchart-d1-ah)"/>
  <path class="d-edge" d="M639,321 H654" marker-end="url(#cross-functional-flowchart-d1-ah)"/>
  <path class="d-edge acc" d="M714,349 V401" marker-end="url(#cross-functional-flowchart-d1-ah)"/>
  <path class="d-edge dash" d="M315,239 V431 H388" marker-end="url(#cross-functional-flowchart-d1-ah)"/>
  <path class="d-edge dash" d="M506,431 H654" marker-end="url(#cross-functional-flowchart-d1-ah)"/>

  <text class="d-lab" x="321" y="148">SEV2</text>
  <text class="d-lab" x="506" y="203" text-anchor="middle">yes</text>
  <text class="d-lab" x="448" y="292">no</text>
  <text class="d-lab" x="676" y="205" text-anchor="middle">done</text>
  <text class="d-lab" x="708" y="393" text-anchor="end">SLO green</text>
  <text class="d-lab" x="321" y="330">notify</text>
  <text class="d-lab" x="581" y="425" text-anchor="middle">update every 30m</text>

  <!-- Support -->
  <rect class="d-box g0" x="124" y="73" width="116" height="56" rx="12"/>
  <text class="d-t" x="134" y="98">5xx tickets</text>
  <text class="d-s" x="134" y="116">12 in 5 min</text>
  <rect class="d-box g0" x="257" y="73" width="116" height="56" rx="12"/>
  <text class="d-t" x="267" y="98">Page SEV2</text>
  <text class="d-s" x="267" y="116">checkout-api</text>
  <image class="d-logo" data-logo="pagerduty.com" data-name="PagerDuty" x="347" y="81" width="18" height="18"/>

  <!-- On-call -->
  <rect class="d-box g1" x="257" y="183" width="116" height="56" rx="12"/>
  <text class="d-t" x="267" y="208">Ack + triage</text>
  <text class="d-s" x="267" y="226">within 5 min</text>
  <polygon class="d-box g1" points="442,165 490,211 442,257 394,211"/>
  <text class="d-t" x="442" y="207" text-anchor="middle">Bad</text>
  <text class="d-t" x="442" y="224" text-anchor="middle">deploy?</text>
  <rect class="d-box g1" x="523" y="183" width="116" height="56" rx="12"/>
  <text class="d-t" x="533" y="208">Roll back</text>
  <text class="d-s" x="533" y="226">v4.12 to v4.11</text>
  <image class="d-logo" data-logo="argoproj.github.io" data-name="Argo CD" x="613" y="191" width="18" height="18"/>

  <!-- SRE -->
  <rect class="d-box g2" x="523" y="293" width="116" height="56" rx="12"/>
  <text class="d-t" x="533" y="318">Fail over</text>
  <text class="d-s" x="533" y="336">RDS to replica</text>
  <image class="d-logo" data-logo="aws.amazon.com" data-name="AWS RDS" x="613" y="301" width="18" height="18"/>
  <rect class="d-box g2" x="656" y="293" width="116" height="56" rx="12"/>
  <text class="d-t" x="666" y="318">Verify SLO</text>
  <text class="d-s" x="666" y="336">5xx under 0.1%</text>
  <image class="d-logo" data-logo="grafana.com" data-name="Grafana" x="746" y="301" width="18" height="18"/>

  <!-- Comms -->
  <rect class="d-box g3" x="390" y="403" width="116" height="56" rx="12"/>
  <text class="d-t" x="400" y="428">#incident</text>
  <text class="d-s" x="400" y="446">investigating</text>
  <image class="d-logo" data-logo="slack.com" data-name="Slack" x="480" y="411" width="18" height="18"/>
  <rect class="d-box g3" x="656" y="403" width="116" height="56" rx="12"/>
  <text class="d-t" x="666" y="428">Resolved</text>
  <text class="d-s" x="666" y="446">postmortem 48h</text>
  <image class="d-logo" data-logo="statuspage.io" data-name="Statuspage" x="746" y="411" width="18" height="18"/>
</svg>
