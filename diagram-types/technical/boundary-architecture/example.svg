<text class="d-s" x="796" y="206">customer role</text>
<text class="d-m" x="784" y="240">&lt;prefix&gt;/tenant/&lt;id&gt;/</text>
<text class="d-m" x="784" y="258">&lt;prefix&gt;/compacted/</text>
<text class="d-s" x="784" y="280">one prefix per tenant</text>
<rect class="d-band" x="768" y="316" width="196" height="240" rx="12"/>
<text class="d-k" x="784" y="340">TABLE CATALOGS</text>
<rect class="d-box g4" x="784" y="352" width="164" height="48" rx="8"/>
<text class="d-t" x="796" y="372">Platform catalog</text>
<text class="d-s" x="796" y="390">platform tables</text>
