<text class="d-t" x="534" y="340">Compactor</text>
<text class="d-s" x="534" y="358">merges small files</text>
<text class="d-s" x="534" y="374">on a schedule</text>
<rect class="d-box g4" x="328" y="352" width="170" height="144" rx="12"/>
<text class="d-t" x="340" y="376">Query API</text>
<text class="d-s" x="340" y="394">read only</text>
<rect class="d-box" x="342" y="406" width="142" height="30" rx="6"/>
<text class="d-m" x="354" y="426">DuckDB · hot</text>
<rect class="d-box" x="342" y="448" width="142" height="30" rx="6"/>
<text class="d-m" x="354" y="468">DuckDB · archive</text>
<rect class="d-blob2" x="328" y="552" width="170" height="68" rx="10"/>
<text class="d-t" x="340" y="576">Public query proxy</text>
<text class="d-s" x="340" y="594">outside the boundary,</text>
<text class="d-s" x="340" y="610">serves untrusted reads</text>
<rect class="d-band g1" x="716" y="72" width="28" height="484" rx="6"/>
<text class="d-s" x="734" y="314" text-anchor="middle" transform="rotate(-90 734 314)">Short-lived role credentials, no stored keys</text>
<rect class="d-band" x="768" y="72" width="196" height="220" rx="12"/>
<text class="d-k" x="784" y="96">OBJECT STORAGE</text>
<rect class="d-box g4" x="784" y="108" width="164" height="48" rx="8"/>
<text class="d-t" x="796" y="128">Platform bucket</text>
<text class="d-s" x="796" y="146">platform role</text>
