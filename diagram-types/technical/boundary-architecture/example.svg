<svg class="hd" viewBox="0 0 996 704" role="img" aria-label="Boundary architecture of a metrics ingestion platform: agents, edge collectors and analysts cross an mTLS gate into the platform boundary, where replicated write workers, a metadata database, a compactor and a read only query API run; a credential bar on the right shows how the platform reaches object storage and table catalogs owned by the platform or the customer, and an untrusted public query proxy sits outside the boundary" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="boundary-architecture-d1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-edge acc" x="260" y="40" width="432" height="480" rx="16"/>
<text class="d-k" x="276" y="66">PLATFORM BOUNDARY</text>
<path class="d-edge" d="M188,112 H326" marker-end="url(#boundary-architecture-d1-ah)"/>
<text class="d-lab" x="198" y="105">OTLP</text>
<path class="d-edge" d="M188,168 H326" marker-end="url(#boundary-architecture-d1-ah)"/>
<text class="d-lab" x="198" y="161">batch push</text>
<path class="d-edge" d="M188,424 H326" marker-end="url(#boundary-architecture-d1-ah)"/>
<text class="d-lab" x="198" y="417">SQL</text>
