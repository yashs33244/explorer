<text class="d-t" x="796" y="432">Customer catalog</text>
<text class="d-s" x="796" y="450">customer tables</text>
<rect class="d-box" x="784" y="472" width="164" height="48" rx="8"/>
<text class="d-t" x="796" y="492">Table data</text>
<text class="d-s" x="796" y="510">Parquet files</text>
<text class="d-m" x="784" y="542">catalog.ns.table</text>
<path class="d-edge acc" d="M32,662 H60"/>
<text class="d-s" x="68" y="667">trust boundary</text>
<rect class="d-band g1" x="196" y="652" width="12" height="20" rx="3"/>
<text class="d-s" x="216" y="667">checked on every call</text>
<rect class="d-box g4" x="384" y="654" width="20" height="16" rx="3"/>
