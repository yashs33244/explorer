<text class="d-lab" x="528" y="113">PUT objects</text>
<path class="d-edge" d="M510,164 H560 V194" marker-end="url(#boundary-architecture-d1-ah)"/>
<text class="d-lab" x="572" y="186">cursors</text>
<path class="d-edge" d="M470,352 V240 H520" marker-end="url(#boundary-architecture-d1-ah)"/>
<text class="d-lab" x="462" y="300" text-anchor="end">locate tables</text>
<path class="d-edge" d="M597,316 V286" marker-end="url(#boundary-architecture-d1-ah)"/>
<text class="d-lab" x="607" y="306">lease</text>
<path class="d-edge" d="M597,388 V420 H766" marker-end="url(#boundary-architecture-d1-ah)"/>
<text class="d-lab" x="606" y="413">commit files</text>
<path class="d-edge" d="M498,480 H766" marker-end="url(#boundary-architecture-d1-ah)"/>
<text class="d-lab" x="520" y="473">read tables</text>
<rect class="d-band" x="32" y="72" width="156" height="68" rx="10"/>
<text class="d-t" x="44" y="96">Agents and SDKs</text>
<text class="d-s" x="44" y="114">instrumented apps</text>
<text class="d-s" x="44" y="130">and host agents</text>
<rect class="d-band" x="32" y="156" width="156" height="68" rx="10"/>
<text class="d-t" x="44" y="180">Edge collectors</text>
<text class="d-s" x="44" y="198">site gateways that</text>
<text class="d-s" x="44" y="214">batch and push</text>
<rect class="d-band" x="32" y="390" width="156" height="68" rx="10"/>
<text class="d-t" x="44" y="414">Analysts</text>
<text class="d-s" x="44" y="432">trusted readers,</text>
<text class="d-s" x="44" y="448">ad hoc SQL</text>
<rect class="d-blob2" x="32" y="552" width="156" height="68" rx="10"/>
<text class="d-t" x="44" y="576">Public dashboards</text>
<text class="d-s" x="44" y="594">untrusted viewers,</text>
<text class="d-s" x="44" y="610">outside scope</text>
<rect class="d-band g1" x="276" y="80" width="28" height="420" rx="6"/>
<text class="d-s" x="294" y="290" text-anchor="middle" transform="rotate(-90 294 290)">mTLS client certificate checked on every call</text>
<rect class="d-box g4" x="340" y="80" width="170" height="88" rx="12"/>
<rect class="d-box g4" x="334" y="86" width="170" height="88" rx="12"/>
<rect class="d-box g4" x="328" y="92" width="170" height="88" rx="12"/>
<text class="d-t" x="340" y="116">Write workers</text>
<text class="d-s" x="340" y="136">buffer per tenant,</text>
<text class="d-s" x="340" y="154">flush on size or time</text>
<rect class="d-box g4" x="522" y="196" width="150" height="88" rx="12"/>
<text class="d-t" x="534" y="220">Metadata DB</text>
