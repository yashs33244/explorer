<svg xmlns="http://www.w3.org/2000/svg" class="hd" viewBox="0 0 1200 780" role="img" aria-labelledby="repo-map-d1-title"><title id="repo-map-d1-title">acme/storefront repo structure and dependencies</title><defs><marker id="repo-map-d1-ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-fillink g0" d="M0 0 L10 5 L0 10 z"/></marker><marker id="repo-map-d1-ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-fillink g1" d="M0 0 L10 5 L0 10 z"/></marker><marker id="repo-map-d1-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-fillink g3" d="M0 0 L10 5 L0 10 z"/></marker><marker id="repo-map-d1-ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-fillink g4" d="M0 0 L10 5 L0 10 z"/></marker></defs><g id="repo-map-d1-repo"><rect class="d-zone" x="40" y="52" width="760" height="640"/><rect class="d-band" x="56" y="40" width="133" height="24"/><text class="d-mb" x="68" y="56">acme/storefront</text></g><g id="repo-map-d1-apps" data-node="apps"><rect class="d-zone g0" x="64" y="84" width="712" height="95"/><text class="d-zt g0" x="78" y="108">Process roots</text><text class="d-m g0" x="200" y="108">apps/</text><text class="d-s" x="78" y="131">The only folders that build a binary or a bundle. Each one wires modules together and owns its config.</text><rect class="d-chip on" x="78" y="141" width="74" height="22"/><text class="d-mb" x="86" y="156">apps/web</text><rect class="d-chip on" x="158" y="141" width="74" height="22"/><text class="d-mb" x="166" y="156">apps/api</text><rect class="d-chip" x="238" y="141" width="96" height="22"/><text class="d-m" x="246" y="156">apps/worker</text><rect class="d-chip" x="340" y="141" width="88" height="22"/><text class="d-m" x="348" y="156">apps/admin</text></g><g id="repo-map-d1-mods" data-node="mods"><rect class="d-zone g1" x="64" y="219" width="712" height="112"/><text class="d-zt g1" x="78" y="243">Feature modules</text><text class="d-m g1" x="217" y="243">modules/</text><text class="d-s" x="78" y="266">One folder per business area. Each exports routes, jobs and UI. A module may use packages, never another</text><text class="d-s" x="78" y="283">module.</text><rect class="d-chip" x="78" y="293" width="74" height="22"/><text class="d-m" x="86" y="308">checkout</text><rect class="d-chip" x="158" y="293" width="67" height="22"/><text class="d-m" x="166" y="308">catalog</text><rect class="d-chip" x="231" y="293" width="60" height="22"/><text class="d-m" x="239" y="308">search</text><rect class="d-chip" x="297" y="293" width="74" height="22"/><text class="d-m" x="305" y="308">accounts</text><rect class="d-chip" x="377" y="293" width="60" height="22"/><text class="d-m" x="385" y="308">orders</text><rect class="d-chip dash" x="443" y="293" width="255" height="22"/><text class="d-m" x="451" y="308">payments → moving to acme/pay-svc</text></g><g id="repo-map-d1-pkgs" data-node="pkgs"><rect class="d-zone g5" x="64" y="371" width="712" height="219"/><text class="d-zt g5" x="78" y="395">Shared packages</text><text class="d-m g5" x="217" y="395">packages/</text><text class="d-s" x="78" y="418">Libraries with no business logic. Published to the internal registry so other repos can use them too.</text><text class="d-g" x="78" y="440">Data</text><rect class="d-chip on" x="78" y="448" width="30" height="22"/><text class="d-mb" x="86" y="463">db</text><rect class="d-chip" x="114" y="448" width="110" height="22"/><text class="d-m" x="122" y="463">db-migrations</text><rect class="d-chip" x="230" y="448" width="52" height="22"/><text class="d-m" x="238" y="463">cache</text><text class="d-g" x="78" y="492">Platform</text><rect class="d-chip" x="78" y="500" width="96" height="22"/><text class="d-m" x="86" y="515">http-client</text><rect class="d-chip" x="180" y="500" width="45" height="22"/><text class="d-m" x="188" y="515">auth</text><rect class="d-chip" x="231" y="500" width="60" height="22"/><text class="d-m" x="239" y="515">config</text><rect class="d-chip" x="297" y="500" width="81" height="22"/><text class="d-m" x="305" y="515">telemetry</text><rect class="d-chip" x="384" y="500" width="110" height="22"/><text class="d-m" x="392" y="515">feature-flags</text><text class="d-g" x="78" y="544">UI</text><rect class="d-chip" x="78" y="552" width="60" height="22"/><text class="d-m" x="86" y="567">ui-kit</text><rect class="d-chip dash" x="144" y="552" width="161" height="22"/><text class="d-m" x="152" y="567">vendor/design-tokens</text></g><g id="repo-map-d1-infra" data-node="infra"><rect class="d-zone g4" x="832" y="84" width="328" height="140"/><text class="d-zt g4" x="846" y="108">Deploy</text><text class="d-m g4" x="908" y="108">infra/</text><text class="d-s" x="846" y="131">Helm values per environment and the CI</text><text class="d-s" x="846" y="148">pipeline. Charts come from the platform repo.</text><rect class="d-chip on" x="846" y="158" width="146" height="22"/><text class="d-mb" x="854" y="173">helm/values-*.yaml</text><rect class="d-chip" x="998" y="158" width="125" height="22"/><text class="d-m" x="1006" y="173">ci/pipeline.yml</text><rect class="d-chip" x="846" y="186" width="88" height="22"/><text class="d-m" x="854" y="201">terraform/</text></g><g id="repo-map-d1-ext" data-node="ext"><rect class="d-zone g3 dash" x="832" y="268" width="328" height="253"/><text class="d-zt g3" x="846" y="292">Other repositories</text><text class="d-s" x="846" y="315">Built and released on their own.</text><text class="d-g" x="846" y="337">acme/pay-svc</text><rect class="d-chip" x="846" y="345" width="103" height="22"/><text class="d-m" x="854" y="360">payments API</text><text class="d-s" x="846" y="384">Takes over modules/payments.</text><text class="d-g" x="846" y="406">acme/design-tokens</text><rect class="d-chip" x="846" y="414" width="96" height="22"/><text class="d-m" x="854" y="429">tokens.json</text><text class="d-s" x="846" y="453">Git submodule at packages/vendor.</text><text class="d-g" x="846" y="475">acme/platform</text><rect class="d-chip" x="846" y="483" width="118" height="22"/><text class="d-m" x="854" y="498">charts/web-app</text></g><rect class="d-note" x="64" y="612" width="712" height="50"/><text class="d-tn" x="76" y="634">Layer rule: apps → modules → packages. A module never imports another module. Checked in CI</text><text class="d-tn" x="76" y="651">by pnpm check-deps.</text><g data-edge="apps mods"><path id="repo-map-d1-e0" class="d-edge g0" d="M 420 179 V 217" marker-end="url(#repo-map-d1-ah0)"/><text class="d-lab" x="430" y="203" text-anchor="start">imports</text></g><g data-edge="mods pkgs"><path id="repo-map-d1-e1" class="d-edge g1" d="M 420 331 V 369" marker-end="url(#repo-map-d1-ah1)"/><text class="d-lab" x="430" y="355" text-anchor="start">imports</text></g><g data-edge="mods ext"><path id="repo-map-d1-e2" class="d-edge dot g3" d="M 776 292 H 830" marker-end="url(#repo-map-d1-ah3)"/><text class="d-lab" x="786" y="284" text-anchor="start">calls</text></g><g data-edge="pkgs ext"><path id="repo-map-d1-e3" class="d-edge dash g3" d="M 776 560 H 812 V 440 H 830" marker-end="url(#repo-map-d1-ah3)"/><text class="d-lab" x="820" y="545" text-anchor="start">submodule</text></g><g data-edge="infra ext"><path id="repo-map-d1-e4" class="d-edge dash g4" d="M 996 224 V 266" marker-end="url(#repo-map-d1-ah4)"/><text class="d-lab" x="1006" y="250" text-anchor="start">chart from</text></g><path class="d-edge" d="M 56 732 H 92"/><text class="d-s" x="102" y="736">depends on (links)</text><path class="d-edge dash" d="M 253 732 H 289"/><text class="d-s" x="299" y="736">vendored, pinned copy or submodule</text><path class="d-edge dot" d="M 553 732 H 589"/><text class="d-s" x="599" y="736">calls at runtime</text><rect class="d-chip on" x="744" y="721" width="22" height="22"/><text class="d-s" x="783" y="736">entry point</text><rect class="d-chip dash" x="896" y="721" width="22" height="22"/><text class="d-s" x="935" y="736">moving or symlinked</text></svg>
