<text class="d-tn" x="172" y="386">on 3 bad probes</text>
<rect class="d-note g1" x="160" y="430" width="130" height="96" rx="4"/>
<text class="d-tn" x="172" y="456">All services</text>
<text class="d-tn" x="172" y="476">use managed</text>
<text class="d-tn" x="172" y="496">identity, no</text>
<text class="d-tn" x="172" y="516">connection keys</text>
<rect class="d-blob2" x="330" y="120" width="450" height="560" rx="28"/>
<text class="d-h" x="350" y="148">Region: West Europe</text>
<text class="d-m" x="580" y="148">vnet-shop 10.20.0.0/16</text>
<rect class="d-box g2" x="345" y="170" width="180" height="76" rx="12"/>
