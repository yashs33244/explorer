<text class="d-t" x="65" y="228" text-anchor="middle">Shoppers</text>
<text class="d-s" x="65" y="243" text-anchor="middle">web, iOS</text>
<text class="d-k" x="160" y="150">Global edge</text>
<rect class="d-box g1" x="160" y="170" width="130" height="80" rx="12"/>
<image class="d-logo" data-logo="azure.microsoft.com" data-name="Azure Front Door" x="170" y="180" width="26" height="26"/>
<text class="d-t" x="204" y="198">Front Door</text>
<text class="d-m" x="170" y="232">afd-shop + WAF</text>
<rect class="d-note g4" x="160" y="300" width="130" height="96" rx="4"/>
