<svg class="hd" viewBox="0 0 800 700" role="img" aria-label="Cloud architecture of a checkout workload in one Azure region: shoppers reach Front Door, which routes to App Service; orders flow through Service Bus to Functions and into Cosmos DB, with Key Vault for secrets and a Log Analytics workspace, shared with Application Insights, for traces and audit logs" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="cloud-architecture-d1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-blob" x="20" y="20" width="360" height="76" rx="18"/>
<text class="d-k" x="40" y="46">Workload</text>
<text class="d-t" x="40" y="66">checkout for shop.contoso.io</text>
<text class="d-s" x="40" y="84">2k orders/min at peak, EU shoppers</text>
<rect class="d-blob" x="400" y="20" width="380" height="76" rx="18"/>
<text class="d-k" x="420" y="46">Constraints</text>
<text class="d-s" x="420" y="66">p99 checkout under 300 ms</text>
<text class="d-s" x="420" y="84">no app-setting secrets, data survives region loss</text>
<rect class="d-box g0" x="20" y="170" width="90" height="80" rx="12"/>
