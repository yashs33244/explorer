<svg class="hd" viewBox="0 0 800 580" role="img" aria-label="UML use case diagram of a CI/CD platform: developer, reviewer and release bot actors, use cases inside the system boundary, include and extend relations" xmlns="http://www.w3.org/2000/svg">
