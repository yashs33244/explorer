<text class="d-s" x="24" y="118">GA on AWS and GCP, Q2</text>
<text class="d-s" x="24" y="136">owner: data-platform team</text>
<rect class="d-box g0" x="24" y="170" width="236" height="214" rx="12"/>
<text class="d-t" x="40" y="196">What we decided</text>
