<svg class="hd" viewBox="0 0 800 620" role="img" aria-label="PEST analysis for launching a managed vector database: political, economic, social and technological factors in four circles, with the launch decisions they lead to" xmlns="http://www.w3.org/2000/svg">
<rect class="d-tag acc" x="24" y="40" width="118" height="26" rx="6"/>
