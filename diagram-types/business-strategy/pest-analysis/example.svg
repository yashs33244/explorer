<text class="d-h" x="412" y="394" text-anchor="middle">S Social</text>
<text class="d-s" x="412" y="422" text-anchor="middle">RAG is every team's demo</text>
<text class="d-s" x="412" y="442" text-anchor="middle">devs expect a free tier</text>
<text class="d-s" x="412" y="462" text-anchor="middle">trust open source first</text>
<rect class="d-tag" x="362" y="492" width="101" height="22" rx="11"/>
<text class="d-s" x="412" y="507" text-anchor="middle">drives 2, 3</text>
<circle class="d-soft g3" cx="660" cy="434" r="126"/>
<g transform="translate(640,326)"><g><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37 M8,8 L11.5,11.5 M28.5,28.5 L32,32 M8,32 L11.5,28.5 M28.5,11.5 L32,8"/></g></g>
<text class="d-h" x="660" y="394" text-anchor="middle">T Technological</text>
<text class="d-s" x="660" y="422" text-anchor="middle">pgvector rivals vector DBs</text>
<text class="d-s" x="660" y="442" text-anchor="middle">HNSW indexes are RAM-heavy</text>
<text class="d-s" x="660" y="462" text-anchor="middle">embedding models churn</text>
<rect class="d-tag acc" x="610" y="492" width="101" height="22" rx="11"/>
<text class="d-s" x="660" y="507" text-anchor="middle">drives 3, 4</text>
<text class="d-s" x="536" y="596" text-anchor="middle">outside forces we cannot change, only plan the launch around</text>
