<circle class="d-badge" cx="51" cy="266" r="11"/><text class="d-bt" x="51" y="270">2</text>
<text class="d-s" x="70" y="270">price per GB stored</text>
<circle class="d-badge" cx="51" cy="306" r="11"/><text class="d-bt" x="51" y="310">3</text>
<text class="d-s" x="70" y="310">pgvector-compatible API</text>
<circle class="d-badge" cx="51" cy="346" r="11"/><text class="d-bt" x="51" y="350">4</text>
<text class="d-s" x="70" y="350">HNSW tier sized by RAM</text>
<rect class="d-tag acc" x="24" y="410" width="88" height="20" rx="10"/>
<text class="d-s" x="68" y="424" text-anchor="middle">high impact</text>
<rect class="d-tag" x="122" y="410" width="88" height="20" rx="10"/>
<text class="d-s" x="166" y="424" text-anchor="middle">watch</text>
<text class="d-s" x="24" y="456">numbers trace each factor</text>
<text class="d-s" x="24" y="474">to the decision it drove</text>
<image class="d-logo" data-logo="aws.amazon.com" data-name="AWS" x="24" y="500" width="26" height="26"/>
<image class="d-logo" data-logo="cloud.google.com" data-name="Google Cloud" x="58" y="500" width="26" height="26"/>
<image class="d-logo" data-logo="postgresql.org" data-name="PostgreSQL" x="92" y="500" width="26" height="26"/>
<text class="d-s" x="24" y="546">runs on Postgres 16 + pgvector</text>
<circle class="d-soft g4" cx="412" cy="178" r="126"/>
<g transform="translate(392,70)"><g><path class="d-fillpaper" d="M4,14 L20,4 L36,14 Z"/><path class="d-line" d="M8,17 V32 M15,17 V32 M25,17 V32 M32,17 V32"/><path class="d-lineacc" d="M4,35 H36"/></g></g>
<text class="d-h" x="412" y="138" text-anchor="middle">P Political</text>
<text class="d-s" x="412" y="166" text-anchor="middle">EU AI Act duties</text>
<text class="d-s" x="412" y="186" text-anchor="middle">GDPR: EU data residency</text>
<text class="d-s" x="412" y="206" text-anchor="middle">US GPU export limits</text>
<rect class="d-tag acc" x="372" y="236" width="80" height="22" rx="11"/>
<text class="d-s" x="412" y="251" text-anchor="middle">drives 1</text>
<circle class="d-soft g5" cx="660" cy="178" r="126"/>
<g transform="translate(640,70)"><g><rect class="d-fillpaper" x="3" y="5" width="34" height="28" rx="3"/><path class="d-lineacc" d="M8,27 L16,19 L22,23 L32,11"/><path class="d-line" d="M27,11 H32 V16"/></g></g>
<text class="d-h" x="660" y="138" text-anchor="middle">E Economic</text>
<text class="d-s" x="660" y="166" text-anchor="middle">RAM and GPU costs rising</text>
<text class="d-s" x="660" y="186" text-anchor="middle">price war: Pinecone, Weaviate</text>
<text class="d-s" x="660" y="206" text-anchor="middle">buyers want usage pricing</text>
<rect class="d-tag acc" x="610" y="236" width="101" height="22" rx="11"/>
