<svg class="hd" viewBox="0 0 800 572" role="img" aria-label="Storyboard of incident INC-482 in six panels: a deploy fails on a database migration, an alert pages on-call, the service is rolled back, the migration is fixed, the release is redeployed through a canary, and a postmortem files action items" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="storyboard-d1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<text class="d-k" x="24" y="34">INCIDENT INC-482, CHECKOUT API</text>
<text class="d-h" x="24" y="56">From failed deploy to postmortem</text>

<!-- panel frames -->
<rect class="d-lane" x="24" y="76" width="240" height="150"/>
<rect class="d-lane" x="280" y="76" width="240" height="150"/>
<rect class="d-lane" x="536" y="76" width="240" height="150"/>
<rect class="d-lane" x="24" y="330" width="240" height="150"/>
<rect class="d-lane" x="280" y="330" width="240" height="150"/>
<rect class="d-lane" x="536" y="330" width="240" height="150"/>
<path class="d-edge" d="M265,151 H278" marker-end="url(#storyboard-d1-ah)"/>
<path class="d-edge" d="M521,151 H534" marker-end="url(#storyboard-d1-ah)"/>
<path class="d-edge" d="M265,405 H278" marker-end="url(#storyboard-d1-ah)"/>
<path class="d-edge" d="M521,405 H534" marker-end="url(#storyboard-d1-ah)"/>

<!-- 1 deploy fails -->
<image class="d-logo" data-logo="github.com" data-name="GitHub Actions" x="36" y="88" width="22" height="22"/>
<text class="d-m" x="66" y="104">deploy.yml #812</text>
<rect class="d-box g1" x="36" y="126" width="64" height="30" rx="8"/>
<text class="d-s" x="68" y="146" text-anchor="middle">build</text>
<rect class="d-box g1" x="112" y="126" width="64" height="30" rx="8"/>
<text class="d-s" x="144" y="146" text-anchor="middle">test</text>
<rect class="d-box g3" x="188" y="126" width="64" height="30" rx="8"/>
<text class="d-s" x="220" y="146" text-anchor="middle">deploy</text>
<path class="d-edge" d="M100,141 H110" marker-end="url(#storyboard-d1-ah)"/>
<path class="d-edge" d="M176,141 H186" marker-end="url(#storyboard-d1-ah)"/>
<rect class="d-tag acc" x="36" y="174" width="216" height="26" rx="13"/>
<text class="d-m" x="144" y="192" text-anchor="middle">migrate: lock timeout</text>

<!-- 2 alert -->
<image class="d-logo" data-logo="pagerduty.com" data-name="PagerDuty" x="292" y="88" width="22" height="22"/>
<text class="d-m" x="322" y="104">SEV2 paged</text>
<path class="d-grid" d="M300,140 H430 M300,170 H430"/>
<path class="d-axis" d="M300,120 V206 H430"/>
<path class="d-edge dash" d="M300,160 H430"/>
<path class="d-edge acc thick" d="M302,200 L330,198 L356,199 L376,196 L392,130 L410,126 L428,128"/>
<text class="d-s" x="306" y="134">5xx 12%</text>
<g transform="translate(452,124)"><circle class="d-line" cx="20" cy="12" r="7"/><path class="d-line" d="M6,36 C6,25 34,25 34,36 Z"/></g>
<text class="d-s" x="472" y="180" text-anchor="middle">on-call</text>

<!-- 3 rollback -->
<image class="d-logo" data-logo="kubernetes.io" data-name="Kubernetes" x="548" y="88" width="22" height="22"/>
<text class="d-m" x="578" y="104">checkout-api</text>
<rect class="d-box g3" x="560" y="124" width="72" height="34" rx="10"/>
<text class="d-t" x="596" y="146" text-anchor="middle">v2.31</text>
<rect class="d-box g1" x="680" y="124" width="72" height="34" rx="10"/>
<text class="d-t" x="716" y="146" text-anchor="middle">v2.30</text>
<path class="d-edge acc" d="M632,141 H678" marker-end="url(#storyboard-d1-ah)"/>
<text class="d-lab" x="655" y="131" text-anchor="middle">undo</text>
<rect class="d-tag" x="560" y="174" width="192" height="26" rx="13"/>
<text class="d-m" x="656" y="192" text-anchor="middle">kubectl rollout undo</text>

<!-- 4 fix -->
<image class="d-logo" data-logo="github.com" data-name="GitHub" x="36" y="342" width="22" height="22"/>
<text class="d-m" x="66" y="358">PR #1931</text>
<text class="d-m" x="36" y="390">0142_orders.sql</text>
<rect class="d-fill g3 o1" x="36" y="400" width="216" height="26"/>
<text class="d-m" x="44" y="418">- CREATE INDEX ON orders</text>
<rect class="d-fill g1 o1" x="36" y="432" width="216" height="26"/>
<text class="d-m" x="44" y="450">+ CREATE INDEX CONCURRENTLY</text>

<!-- 5 redeploy canary -->
<image class="d-logo" data-logo="argoproj.github.io" data-name="Argo CD" x="292" y="342" width="22" height="22"/>
<text class="d-m" x="322" y="358">canary v2.32</text>
<text class="d-s" x="292" y="394">5%</text>
<rect class="d-fill g1" x="330" y="382" width="10" height="16" rx="3"/>
<text class="d-s" x="292" y="422">50%</text>
<rect class="d-fill g1" x="330" y="410" width="88" height="16" rx="3"/>
<text class="d-s" x="292" y="450">100%</text>
<rect class="d-fill g1" x="330" y="438" width="176" height="16" rx="3"/>
<text class="d-s" x="350" y="395">errors 0.1%</text>

<!-- 6 postmortem -->
<g transform="translate(548,346)"><path class="d-fillpaper" d="M8,3 H25 L33,11 V37 H8 Z"/><path class="d-line" d="M25,3 V11 H33"/><path class="d-lineacc" d="M13,20 H28 M13,26 H28 M13,32 H22"/></g>
<text class="d-m" x="594" y="372">blameless review</text>
<rect class="d-note g2" x="548" y="398" width="104" height="66" rx="4"/>
<text class="d-tn" x="558" y="422">Cause: lock</text>
<text class="d-tn" x="558" y="442">on orders</text>
<rect class="d-note" x="662" y="398" width="104" height="66" rx="4"/>
<text class="d-tn" x="672" y="422">Lint every</text>
<text class="d-tn" x="672" y="442">migration</text>

<!-- captions -->
<circle class="d-badge" cx="35" cy="248" r="11"/><text class="d-bt" x="35" y="252">1</text>
<text class="d-t" x="54" y="253">Deploy fails</text>
<text class="d-s" x="24" y="276">14:02, v2.31 migration</text>
<text class="d-s" x="24" y="294">times out in prod</text>
<circle class="d-badge" cx="291" cy="248" r="11"/><text class="d-bt" x="291" y="252">2</text>
<text class="d-t" x="310" y="253">Alert fires</text>
<text class="d-s" x="280" y="276">14:05, 5xx crosses the 5%</text>
<text class="d-s" x="280" y="294">threshold, on-call paged</text>
<circle class="d-badge" cx="547" cy="248" r="11"/><text class="d-bt" x="547" y="252">3</text>
<text class="d-t" x="566" y="253">Roll back</text>
<text class="d-s" x="536" y="276">14:11, v2.30 restored,</text>
<text class="d-s" x="536" y="294">errors back to baseline</text>
<circle class="d-badge" cx="35" cy="502" r="11"/><text class="d-bt" x="35" y="506">4</text>
<text class="d-t" x="54" y="507">Fix forward</text>
<text class="d-s" x="24" y="530">14:40, index built without</text>
<text class="d-s" x="24" y="548">locking the orders table</text>
<circle class="d-badge" cx="291" cy="502" r="11"/><text class="d-bt" x="291" y="506">5</text>
<text class="d-t" x="310" y="507">Redeploy</text>
<text class="d-s" x="280" y="530">15:20, canary steps 5, 50,</text>
<text class="d-s" x="280" y="548">100% while errors stay flat</text>
<circle class="d-badge" cx="547" cy="502" r="11"/><text class="d-bt" x="547" y="506">6</text>
<text class="d-t" x="566" y="507">Postmortem</text>
<text class="d-s" x="536" y="530">Next day, cause agreed and</text>
<text class="d-s" x="536" y="548">a CI lint action filed</text>
</svg>
