<svg class="hd" viewBox="0 0 800 480" role="img" aria-label="Anatomy of RelOptInfo and Path, the planner records that hold candidate plans and their costs" xmlns="http://www.w3.org/2000/svg"><defs><marker id="planner-d3-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs><rect class="d-box g1" x="20" y="30" width="320" height="246" rx="16"/><text class="d-t" x="36" y="56">RelOptInfo</text><text class="d-s" x="130" y="56">one per table or join</text><text class="d-t" x="36" y="92">relids</text><text class="d-s" x="205" y="92">tables in this rel</text><text class="d-t" x="36" y="124">rows</text><text class="d-s" x="205" y="124">estimated row count</text><text class="d-t" x="36" y="156">pathlist</text><text class="d-s" x="205" y="156">all kept Paths</text><text class="d-t" x="36" y="188">cheapest_startup_path</text><text class="d-s" x="205" y="188">fast first row</text><text class="d-t" x="36" y="220">cheapest_total_path</text><text class="d-s" x="205" y="220">lowest total cost</text><text class="d-t" x="36" y="252">reltarget</text><text class="d-s" x="205" y="252">columns to output</text><rect class="d-box g2" x="420" y="30" width="360" height="324" rx="16"/><text class="d-t" x="436" y="56">Path</text><text class="d-s" x="490" y="56">one candidate way to get rows</text><text class="d-t" x="440" y="94">pathtype</text><text class="d-s" x="570" y="94">kind of scan or join</text><text class="d-t" x="440" y="124">parent</text><text class="d-s" x="570" y="124">owning RelOptInfo</text><text class="d-t" x="440" y="154">pathtarget</text><text class="d-s" x="570" y="154">columns produced</text><text class="d-t" x="440" y="184">param_info</text><text class="d-s" x="570" y="184">needs an outer rel?</text><text class="d-t" x="440" y="214">rows</text><text class="d-s" x="570" y="214">estimated rows out</text><rect class="d-box g3" x="430" y="225" width="340" height="26" rx="8"/><text class="d-t" x="440" y="244">disabled_nodes</text><text class="d-s" x="570" y="244">compared first</text><rect class="d-box g3" x="430" y="255" width="340" height="26" rx="8"/><text class="d-t" x="440" y="274">startup_cost</text><text class="d-s" x="570" y="274">cost before first row</text><rect class="d-box g3" x="430" y="285" width="340" height="26" rx="8"/><text class="d-t" x="440" y="304">total_cost</text><text class="d-s" x="570" y="304">cost for all rows</text><text class="d-t" x="440" y="334">pathkeys</text><text class="d-s" x="570" y="334">sort order it gives</text><path class="d-edge acc" d="M340,152 L420,152" marker-end="url(#planner-d3-ah)"/><text class="d-lab" x="380" y="143" text-anchor="middle">lists</text><path class="d-edge acc" d="M340,248 L420,248" marker-end="url(#planner-d3-ah)"/><text class="d-lab" x="380" y="239" text-anchor="middle">picks</text><path class="d-edge dash" d="M420,124 L340,124" marker-end="url(#planner-d3-ah)"/><text class="d-lab" x="380" y="115" text-anchor="middle">owner</text><rect class="d-box g4" x="20" y="390" width="130" height="44" rx="12"/><text class="d-t" x="85" y="418" text-anchor="middle">total_cost</text><text class="d-t" x="170" y="418" text-anchor="middle">=</text><rect class="d-box g3" x="190" y="390" width="150" height="44" rx="12"/><text class="d-t" x="265" y="418" text-anchor="middle">startup_cost</text><text class="d-t" x="360" y="418" text-anchor="middle">+</text><rect class="d-box g2" x="380" y="390" width="400" height="44" rx="12"/><text class="d-t" x="580" y="418" text-anchor="middle">run cost: disk pages + CPU per row</text><text class="d-s" x="20" y="462">Winner: fewest disabled_nodes first, then lowest cost.</text></svg>