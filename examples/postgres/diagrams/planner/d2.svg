<svg class="hd" viewBox="0 0 800 450" role="img" aria-label="Lifecycle of one query through the planner in nine numbered steps, from planner() to EXPLAIN" xmlns="http://www.w3.org/2000/svg"><defs><marker id="planner-d2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs><text class="d-m" x="40" y="30">SELECT ... FROM a JOIN b ORDER BY ...</text><rect class="d-box g0" x="40" y="55" width="200" height="64" rx="14"/><text class="d-t" x="76" y="83">planner()</text><text class="d-s" x="76" y="103">Query tree arrives</text><rect class="d-box g1" x="300" y="55" width="200" height="64" rx="14"/><text class="d-t" x="336" y="83">subquery_planner</text><text class="d-s" x="336" y="103">Flatten and simplify</text><rect class="d-box g1" x="560" y="55" width="200" height="64" rx="14"/><text class="d-t" x="596" y="83">grouping_planner</text><text class="d-s" x="596" y="103">Handles GROUP BY, LIMIT</text><rect class="d-box g2" x="560" y="185" width="200" height="64" rx="14"/><text class="d-t" x="596" y="213">query_planner</text><text class="d-s" x="596" y="233">make_one_rel sizes tables</text><rect class="d-box g3" x="300" y="185" width="200" height="64" rx="14"/><text class="d-t" x="336" y="213">costsize.c</text><text class="d-s" x="336" y="233">Rows from pg_statistic</text><rect class="d-box g2" x="40" y="185" width="200" height="64" rx="14"/><text class="d-t" x="76" y="213">standard_join_search</text><text class="d-s" x="76" y="233">Many tables: GEQO</text><rect class="d-box g2" x="40" y="315" width="200" height="64" rx="14"/><text class="d-t" x="76" y="343">add_path</text><text class="d-s" x="76" y="363">Drop worse Paths</text><rect class="d-box g4" x="300" y="315" width="200" height="64" rx="14"/><text class="d-t" x="336" y="343">create_plan</text><text class="d-s" x="336" y="363">Best Path becomes Plan</text><rect class="d-box g4" x="560" y="315" width="200" height="64" rx="14"/><text class="d-t" x="596" y="343">EXPLAIN</text><text class="d-s" x="596" y="363">Prints cost and rows</text><circle class="d-badge" cx="58" cy="73" r="11"/><text class="d-bt" x="58" y="77">1</text><circle class="d-badge" cx="318" cy="73" r="11"/><text class="d-bt" x="318" y="77">2</text><circle class="d-badge" cx="578" cy="73" r="11"/><text class="d-bt" x="578" y="77">3</text><circle class="d-badge" cx="578" cy="203" r="11"/><text class="d-bt" x="578" y="207">4</text><circle class="d-badge" cx="318" cy="203" r="11"/><text class="d-bt" x="318" y="207">5</text><circle class="d-badge" cx="58" cy="203" r="11"/><text class="d-bt" x="58" y="207">6</text><circle class="d-badge" cx="58" cy="333" r="11"/><text class="d-bt" x="58" y="337">7</text><circle class="d-badge" cx="318" cy="333" r="11"/><text class="d-bt" x="318" y="337">8</text><circle class="d-badge" cx="578" cy="333" r="11"/><text class="d-bt" x="578" y="337">9</text><path class="d-edge acc" d="M240,87 L300,87" marker-end="url(#planner-d2-ah)"/><text class="d-lab" x="270.0" y="78" text-anchor="middle">calls</text><path class="d-edge acc" d="M500,87 L560,87" marker-end="url(#planner-d2-ah)"/><text class="d-lab" x="530.0" y="78" text-anchor="middle">calls</text><path class="d-edge acc" d="M660,119 L660,185" marker-end="url(#planner-d2-ah)"/><text class="d-lab" x="660" y="156.0" text-anchor="middle">calls</text><path class="d-edge acc" d="M560,217 L500,217" marker-end="url(#planner-d2-ah)"/><text class="d-lab" x="530.0" y="208" text-anchor="middle">asks</text><path class="d-edge acc" d="M300,217 L240,217" marker-end="url(#planner-d2-ah)"/><text class="d-lab" x="270.0" y="208" text-anchor="middle">feeds</text><path class="d-edge acc" d="M140,249 L140,315" marker-end="url(#planner-d2-ah)"/><text class="d-lab" x="140" y="286.0" text-anchor="middle">offers</text><path class="d-edge acc" d="M240,347 L300,347" marker-end="url(#planner-d2-ah)"/><text class="d-lab" x="270.0" y="338" text-anchor="middle">keeps</text><path class="d-edge acc" d="M500,347 L560,347" marker-end="url(#planner-d2-ah)"/><text class="d-lab" x="530.0" y="338" text-anchor="middle">prints</text><text class="d-s" x="40" y="425">EXPLAIN shows estimates only. The query itself is not run.</text></svg>