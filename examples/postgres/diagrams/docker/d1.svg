<text class="d-t" x="66" y="90">Container runtime</text>
<rect class="d-box g1" x="24" y="170" width="184" height="50" rx="14"/>
<g transform="translate(30,180) scale(.75)"><path class="d-fillpaper" d="M8,3 H25 L33,11 V37 H8 Z"/><path class="d-line" d="M25,3 V11 H33"/><path class="d-lineacc" d="M13,20 H28 M13,26 H28"/></g>
<text class="d-m" x="62" y="200">docker-entrypoint.sh</text>
<rect class="d-box g1" x="24" y="280" width="184" height="50" rx="14"/>
<g transform="translate(30,290) scale(.75)"><circle class="d-line" cx="20" cy="12" r="7"/><path class="d-line" d="M6,36 C6,25 34,25 34,36 Z"/></g>
<text class="d-t" x="66" y="310">gosu postgres</text>

<rect class="d-box g2" x="270" y="150" width="180" height="50" rx="14"/>
<g transform="translate(276,160) scale(.75)"><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37"/></g>
<text class="d-t" x="312" y="180">postmaster</text>
<rect class="d-box g2" x="270" y="340" width="180" height="50" rx="14"/>
<g transform="translate(276,350) scale(.75)"><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37"/></g>
<text class="d-t" x="312" y="370">initdb</text>

<rect class="d-box g3" x="270" y="474" width="180" height="56" rx="14"/>
<g transform="translate(276,484) scale(.9)"><path class="d-fillpaper" d="M5,9 V31 C5,36 35,36 35,31 V9"/><ellipse class="d-fillpaper" cx="20" cy="9" rx="15" ry="5"/><path class="d-lineacc" d="M5,20 C5,25 35,25 35,20"/></g>
<text class="d-t" x="318" y="498">VOLUME</text>
<text class="d-s" x="318" y="516">PGDATA files</text>

<rect class="d-box g4" x="566" y="60" width="210" height="46" rx="14"/>
<text class="d-t" x="582" y="88">mmap shared memory</text>
