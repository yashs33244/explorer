<svg class="hd" viewBox="0 0 800 560" role="img" aria-label="A docker run goes from a root entrypoint, through gosu, to a postmaster that asks the kernel for shared memory, semaphores and sockets" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="docker-d1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-blob" x="12" y="20" width="208" height="340" rx="36"/>
<text class="d-s" x="30" y="44">Container runtime and image</text>
<rect class="d-blob" x="250" y="110" width="220" height="300" rx="36"/>
<text class="d-s" x="268" y="134">PostgreSQL processes</text>
<rect class="d-blob2" x="250" y="432" width="220" height="112" rx="36"/>
<text class="d-s" x="268" y="454">On disk</text>
<rect class="d-blob" x="552" y="20" width="238" height="480" rx="36"/>
<text class="d-s" x="570" y="44">Linux kernel gives</text>

<rect class="d-box g0" x="24" y="60" width="184" height="50" rx="14"/>
