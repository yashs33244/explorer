<svg class="hd" viewBox="0 0 800 650" role="img" aria-label="Structure: WAL file name, 16MB segment of 8kB pages, and the fields of one WAL record" xmlns="http://www.w3.org/2000/svg"><defs><marker id="walfiles-d3-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-blob" x="15" y="15" width="770" height="110" rx="30"/><text class="d-s" x="33" y="39">File name in pg_wal: 24 hex digits</text>
<rect class="d-box g1" x="45" y="50" width="170" height="40" rx="12"/><text class="d-m" x="130" y="75" text-anchor="middle">00000001</text><text class="d-s" x="130" y="108" text-anchor="middle">timeline</text>
<rect class="d-box g3" x="240" y="50" width="170" height="40" rx="12"/><text class="d-m" x="325" y="75" text-anchor="middle">00000000</text><text class="d-s" x="325" y="108" text-anchor="middle">log id (high LSN)</text>
<rect class="d-box g2" x="435" y="50" width="170" height="40" rx="12"/><text class="d-m" x="520" y="75" text-anchor="middle">00000001</text><text class="d-s" x="520" y="108" text-anchor="middle">segment number</text>
<text class="d-s" x="715" y="75" text-anchor="middle">XLogFileName()</text><text class="d-s" x="715" y="95" text-anchor="middle">in xlog_internal.h</text>
<rect class="d-blob2" x="15" y="140" width="770" height="140" rx="30"/><text class="d-s" x="33" y="164">One segment: 16MB = 2048 pages of 8kB</text>
<rect class="d-box g5" x="35" y="185" width="160" height="60" rx="12"/><text class="d-t" x="115.0" y="210" text-anchor="middle">page 0</text><text class="d-s" x="115.0" y="230" text-anchor="middle">XLogLongPageHeaderData</text>
<rect class="d-box g5" x="205" y="185" width="145" height="60" rx="12"/><text class="d-t" x="277.5" y="210" text-anchor="middle">page 1</text><text class="d-s" x="277.5" y="230" text-anchor="middle">XLogPageHeaderData</text>
<rect class="d-box g5" x="365" y="185" width="145" height="60" rx="12"/><text class="d-t" x="437.5" y="210" text-anchor="middle">page 2</text><text class="d-s" x="437.5" y="230" text-anchor="middle">XLogPageHeaderData</text>
<rect class="d-box g0" x="525" y="185" width="105" height="60" rx="12"/><text class="d-t" x="577.5" y="210" text-anchor="middle">...</text><text class="d-s" x="577.5" y="230" text-anchor="middle">records continue</text>
<rect class="d-box g5" x="645" y="185" width="110" height="60" rx="12"/><text class="d-t" x="700.0" y="210" text-anchor="middle">page 2047</text><text class="d-s" x="700.0" y="230" text-anchor="middle">last page</text>
<rect class="d-blob" x="15" y="295" width="770" height="340" rx="30"/><text class="d-s" x="33" y="319">One record inside a page</text>
<rect class="d-box g1" x="30" y="330" width="150" height="52" rx="12"/><text class="d-t" x="105.0" y="352" text-anchor="middle">XLogRecord</text><text class="d-s" x="105.0" y="371" text-anchor="middle">header</text>
<rect class="d-box" x="30" y="396" width="150" height="112" rx="10"/><text class="d-m" x="40" y="418">xl_tot_len</text><text class="d-m" x="40" y="434">xl_xid</text><text class="d-m" x="40" y="450">xl_prev</text><text class="d-m" x="40" y="466">xl_info</text><text class="d-m" x="40" y="482">xl_rmid</text><text class="d-m" x="40" y="498">xl_crc</text>
<rect class="d-box g2" x="190" y="330" width="160" height="52" rx="12"/><text class="d-t" x="270.0" y="352" text-anchor="middle">Block header</text><text class="d-s" x="270.0" y="371" text-anchor="middle">one per page touched</text>
<rect class="d-box" x="190" y="396" width="160" height="144" rx="10"/><text class="d-m" x="200" y="418">id</text><text class="d-m" x="200" y="434">fork_flags</text><text class="d-m" x="200" y="450">data_length</text><text class="d-m" x="200" y="466">RelFileLocator</text><text class="d-m" x="200" y="482">BlockNumber</text><text class="d-m" x="200" y="498">image: length</text><text class="d-m" x="200" y="514">hole_offset</text><text class="d-m" x="200" y="530">bimg_info</text>
<rect class="d-box g3" x="360" y="330" width="140" height="52" rx="12"/><text class="d-t" x="430.0" y="352" text-anchor="middle">Data header</text><text class="d-s" x="430.0" y="371" text-anchor="middle">XLogRecordDataHeader</text>
<rect class="d-box" x="360" y="396" width="140" height="48" rx="10"/><text class="d-m" x="370" y="418">id</text><text class="d-m" x="370" y="434">length</text>
<rect class="d-box g4" x="510" y="330" width="115" height="52" rx="12"/><text class="d-t" x="567.5" y="352" text-anchor="middle">Block data</text><text class="d-s" x="567.5" y="371" text-anchor="middle">payload per block</text>
<rect class="d-box" x="510" y="396" width="115" height="48" rx="10"/><text class="d-m" x="520" y="418">page image</text><text class="d-m" x="520" y="434">or tuple bytes</text>
<rect class="d-box g0" x="635" y="330" width="135" height="52" rx="12"/><text class="d-t" x="702.5" y="352" text-anchor="middle">Main data</text><text class="d-s" x="702.5" y="371" text-anchor="middle">rmgr payload</text>
<rect class="d-box" x="635" y="396" width="135" height="48" rx="10"/><text class="d-m" x="645" y="418">info picks the</text><text class="d-m" x="645" y="434">redo action</text>
<text class="d-s" x="400" y="610" text-anchor="middle">Records are laid out in this order; xl_rmid names the rmgr (Heap, Btree, Transaction)</text>
</svg>