<rect class="d-box g2" x="30" y="170" width="180" height="56" rx="14"/><g transform="translate(38,178.0)"><rect class="d-fillpaper" x="5" y="4" width="30" height="32" rx="3"/><path class="d-lineacc" d="M5,12 H35"/><rect class="d-fillacc" x="10" y="17" width="20" height="4" rx="1"/><rect class="d-fillacc" x="10" y="24" width="14" height="4" rx="1"/></g><text class="d-t" x="84" y="196.0">wal_buffers</text><text class="d-s" x="84" y="214.0">WAL pages in RAM</text>
