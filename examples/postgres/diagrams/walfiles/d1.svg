<rect class="d-box g1" x="300" y="370" width="200" height="56" rx="14"/><g transform="translate(308,378.0)"><circle class="d-fillpaper" cx="20" cy="20" r="15"/><path class="d-lineacc" d="M20,10 V20 L27,24"/></g><text class="d-t" x="354" y="396.0">checkpointer</text><text class="d-s" x="354" y="414.0">marks REDO point</text>
