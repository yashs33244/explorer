<svg class="hd" viewBox="0 0 800 580" role="img" aria-label="Architecture: backend and walwriter write WAL segments in pg_wal, archiver copies them, checkpointer and startup process use pg_control" xmlns="http://www.w3.org/2000/svg"><defs><marker id="walfiles-d1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-blob" x="15" y="20" width="210" height="220" rx="30"/><text class="d-s" x="33" y="44">Shared memory (RAM)</text>
<rect class="d-blob" x="285" y="20" width="230" height="520" rx="30"/><text class="d-s" x="303" y="44">Background processes</text>
<rect class="d-blob" x="575" y="20" width="210" height="430" rx="30"/><text class="d-s" x="593" y="44">On disk: the data directory</text>
<rect class="d-blob2" x="15" y="440" width="210" height="100" rx="30"/><text class="d-s" x="33" y="464">Archive storage</text>
