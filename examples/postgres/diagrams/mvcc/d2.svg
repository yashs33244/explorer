<svg class="hd" viewBox="0 0 800 600" role="img" aria-label="Timeline: session A updates and commits a row while session B reads, then VACUUM frees the old version" xmlns="http://www.w3.org/2000/svg"><defs><marker id="mvcc-d2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-blob2" x="8" y="15" width="784" height="130" rx="34"/>
<text class="d-s" x="24" y="39" text-anchor="start">Session A (writer)</text>
<g transform="translate(744,23) scale(0.8)"><g><circle class="d-line" cx="20" cy="12" r="7"/><path class="d-line" d="M6,36 C6,25 34,25 34,36 Z"/></g></g>
<rect class="d-blob2" x="8" y="155" width="784" height="130" rx="34"/>
<text class="d-s" x="24" y="179" text-anchor="start">Heap page and pg_xact</text>
<g transform="translate(744,163) scale(0.8)"><g><path class="d-fillpaper" d="M5,9 V31 C5,36 35,36 35,31 V9"/><ellipse class="d-fillpaper" cx="20" cy="9" rx="15" ry="5"/><path class="d-lineacc" d="M5,20 C5,25 35,25 35,20"/></g></g>
<rect class="d-blob2" x="8" y="295" width="784" height="130" rx="34"/>
<text class="d-s" x="24" y="319" text-anchor="start">Session B (reader)</text>
<g transform="translate(744,303) scale(0.8)"><g><circle class="d-line" cx="20" cy="12" r="7"/><path class="d-line" d="M6,36 C6,25 34,25 34,36 Z"/></g></g>
<rect class="d-blob2" x="8" y="435" width="784" height="130" rx="34"/>
<text class="d-s" x="24" y="459" text-anchor="start">VACUUM worker</text>
<g transform="translate(744,443) scale(0.8)"><g><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37 M8,8 L11.5,11.5 M28.5,28.5 L32,32 M8,32 L11.5,28.5 M28.5,11.5 L32,8"/></g></g>
<rect class="d-box g1" x="22" y="57" width="156" height="70" rx="12"/>
<text class="d-t" x="100.0" y="80.0" text-anchor="middle">UPDATE</text>
<text class="d-s" x="100.0" y="97.0" text-anchor="middle">GetNewTransactionId</text>
<text class="d-s" x="100.0" y="114.0" text-anchor="middle">xid 100 assigned</text>
<rect class="d-box g4" x="22" y="197" width="156" height="70" rx="12"/>
<text class="d-t" x="100.0" y="220.0" text-anchor="middle">heap_update</text>
<text class="d-s" x="100.0" y="237.0" text-anchor="middle">old tuple: xmax=100</text>
<text class="d-s" x="100.0" y="254.0" text-anchor="middle">new tuple: xmin=100</text>
<rect class="d-box g2" x="222" y="337" width="156" height="70" rx="12"/>
<text class="d-t" x="300.0" y="360.0" text-anchor="middle">SELECT</text>
<text class="d-s" x="300.0" y="377.0" text-anchor="middle">GetSnapshotData</text>
<text class="d-s" x="300.0" y="394.0" text-anchor="middle">100 is in xip</text>
<rect class="d-box g2" x="222" y="197" width="156" height="70" rx="12"/>
<text class="d-t" x="300.0" y="220.0" text-anchor="middle">Visibility check</text>
<text class="d-s" x="300.0" y="237.0" text-anchor="middle">HeapTupleSatisfiesMVCC</text>
<text class="d-s" x="300.0" y="254.0" text-anchor="middle">old seen, new hidden</text>
<rect class="d-box g1" x="422" y="57" width="156" height="70" rx="12"/>
<text class="d-t" x="500.0" y="80.0" text-anchor="middle">COMMIT</text>
<text class="d-s" x="500.0" y="97.0" text-anchor="middle">CommitTransaction</text>
<text class="d-s" x="500.0" y="114.0" text-anchor="middle">xid 100 finished</text>
<rect class="d-box g3" x="422" y="197" width="156" height="70" rx="12"/>
<text class="d-t" x="500.0" y="220.0" text-anchor="middle">Commit recorded</text>
<text class="d-s" x="500.0" y="237.0" text-anchor="middle">WAL record first</text>
<text class="d-s" x="500.0" y="254.0" text-anchor="middle">then pg_xact: committed</text>
<rect class="d-box g2" x="422" y="337" width="156" height="70" rx="12"/>
<text class="d-t" x="500.0" y="360.0" text-anchor="middle">SELECT again</text>
<text class="d-s" x="500.0" y="377.0" text-anchor="middle">new snapshot taken</text>
<text class="d-s" x="500.0" y="394.0" text-anchor="middle">sees new tuple</text>
<rect class="d-box g5" x="622" y="477" width="156" height="70" rx="12"/>
<text class="d-t" x="700.0" y="500.0" text-anchor="middle">VACUUM</text>
<text class="d-s" x="700.0" y="517.0" text-anchor="middle">lazy_scan_heap</text>
<text class="d-s" x="700.0" y="534.0" text-anchor="middle">no one needs old tuple</text>
<rect class="d-box g4" x="622" y="197" width="156" height="70" rx="12"/>
<text class="d-t" x="700.0" y="220.0" text-anchor="middle">Old tuple freed</text>
<text class="d-s" x="700.0" y="237.0" text-anchor="middle">LP_DEAD, then LP_UNUSED</text>
<text class="d-s" x="700.0" y="254.0" text-anchor="middle">space can be reused</text>
<path class="d-edge" d="M100,127 L100,195" marker-end="url(#mvcc-d2-ah)"/>
<text class="d-lab" x="110" y="158" text-anchor="start">writes</text>
<path class="d-edge" d="M300,335 L300,269" marker-end="url(#mvcc-d2-ah)"/>
<text class="d-lab" x="310" y="308" text-anchor="start">reads</text>
<path class="d-edge" d="M500,127 L500,195" marker-end="url(#mvcc-d2-ah)"/>
<text class="d-lab" x="510" y="166" text-anchor="start">commits</text>
<path class="d-edge" d="M500,335 L500,269" marker-end="url(#mvcc-d2-ah)"/>
<text class="d-lab" x="510" y="308" text-anchor="start">looks up</text>
<path class="d-edge" d="M700,475 L700,269" marker-end="url(#mvcc-d2-ah)"/>
<text class="d-lab" x="712" y="380" text-anchor="start">frees</text>
<circle class="d-badge" cx="26" cy="57" r="11"/><text class="d-bt" x="26" y="61">1</text>
<circle class="d-badge" cx="26" cy="197" r="11"/><text class="d-bt" x="26" y="201">2</text>
<circle class="d-badge" cx="226" cy="337" r="11"/><text class="d-bt" x="226" y="341">3</text>
<circle class="d-badge" cx="226" cy="197" r="11"/><text class="d-bt" x="226" y="201">4</text>
<circle class="d-badge" cx="426" cy="57" r="11"/><text class="d-bt" x="426" y="61">5</text>
<circle class="d-badge" cx="426" cy="197" r="11"/><text class="d-bt" x="426" y="201">6</text>
<circle class="d-badge" cx="426" cy="337" r="11"/><text class="d-bt" x="426" y="341">7</text>
<circle class="d-badge" cx="626" cy="477" r="11"/><text class="d-bt" x="626" y="481">8</text>
<circle class="d-badge" cx="626" cy="197" r="11"/><text class="d-bt" x="626" y="201">9</text>
<path class="d-edge" d="M30,588 L772,588" marker-end="url(#mvcc-d2-ah)"/>
<text class="d-lab" x="400" y="592" text-anchor="middle">time</text>
</svg>
