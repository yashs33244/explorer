<svg class="hd" viewBox="0 0 800 540" role="img" aria-label="Anatomy of an 8kB heap page and the header of one tuple, with xmin, xmax, ctid and hint bits" xmlns="http://www.w3.org/2000/svg"><defs><marker id="mvcc-d3-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-blob" x="24" y="20" width="220" height="500" rx="34"/>
<rect class="d-blob2" x="290" y="20" width="500" height="500" rx="34"/>
<rect class="d-box g1" x="40" y="44" width="190" height="56" rx="12"/>
<text class="d-t" x="135.0" y="68.5" text-anchor="middle">PageHeaderData</text>
<text class="d-s" x="135.0" y="85.5" text-anchor="middle">pd_lower, pd_upper</text>
<rect class="d-box g2" x="40" y="110" width="190" height="70" rx="12"/>
<text class="d-t" x="135.0" y="133.0" text-anchor="middle">Line pointers</text>
<text class="d-s" x="135.0" y="150.0" text-anchor="middle">lp 1 LP_NORMAL</text>
<text class="d-s" x="135.0" y="167.0" text-anchor="middle">lp 2 LP_NORMAL</text>
<rect class="d-box" x="40" y="190" width="190" height="60" rx="12" stroke-dasharray="6 5"/>
<text class="d-t" x="135" y="215" text-anchor="middle">free space</text>
<text class="d-s" x="135" y="233" text-anchor="middle">pd_lower to pd_upper</text>
<rect class="d-box g3" x="40" y="260" width="190" height="60" rx="12"/>
<text class="d-t" x="135.0" y="286.5" text-anchor="middle">tuple 2 (new)</text>
<text class="d-s" x="135.0" y="303.5" text-anchor="middle">xmin = 100</text>
<rect class="d-box g4" x="40" y="330" width="190" height="60" rx="12"/>
<text class="d-t" x="135.0" y="356.5" text-anchor="middle">tuple 1 (old)</text>
<text class="d-s" x="135.0" y="373.5" text-anchor="middle">xmax = 100</text>
<rect class="d-box g0" x="40" y="400" width="190" height="40" rx="12"/>
<text class="d-t" x="135.0" y="416.5" text-anchor="middle">special space</text>
<text class="d-s" x="135.0" y="433.5" text-anchor="middle">empty in heap</text>
<g transform="translate(40,456) scale(1.0)"><g><rect class="d-fillpaper" x="5" y="4" width="30" height="32" rx="3"/><path class="d-lineacc" d="M5,12 H35"/><rect class="d-fillacc" x="10" y="17" width="20" height="4" rx="1"/><rect class="d-fillacc" x="10" y="24" width="14" height="4" rx="1"/></g></g>
<text class="d-t" x="88" y="480" text-anchor="start">8 kB heap page</text>
<text class="d-t" x="306" y="46" text-anchor="start">HeapTupleHeaderData (tuple 1)</text>
<rect class="d-box g2" x="316" y="66" width="170" height="40" rx="12"/>
<text class="d-t" x="401.0" y="91.0" text-anchor="middle">t_xmin</text>
<text class="d-s" x="500" y="90" text-anchor="start">inserted by this xid</text>
<rect class="d-box g2" x="316" y="112" width="170" height="40" rx="12"/>
<text class="d-t" x="401.0" y="137.0" text-anchor="middle">t_xmax</text>
<text class="d-s" x="500" y="129" text-anchor="start">deleted or locked by this xid</text>
<text class="d-s" x="500" y="144" text-anchor="start">0 if none</text>
<rect class="d-box g3" x="316" y="158" width="170" height="40" rx="12"/>
<text class="d-t" x="401.0" y="183.0" text-anchor="middle">t_cid / t_xvac</text>
<text class="d-s" x="500" y="182" text-anchor="start">command id in the transaction</text>
<rect class="d-box g3" x="316" y="204" width="170" height="40" rx="12"/>
<text class="d-t" x="401.0" y="229.0" text-anchor="middle">t_ctid</text>
<text class="d-s" x="500" y="221" text-anchor="start">TID of newer version</text>
<text class="d-s" x="500" y="236" text-anchor="start">points to itself if latest</text>
<rect class="d-box g4" x="316" y="250" width="170" height="40" rx="12"/>
<text class="d-t" x="401.0" y="275.0" text-anchor="middle">t_infomask2</text>
<text class="d-s" x="500" y="267" text-anchor="start">column count and flags</text>
<text class="d-s" x="500" y="282" text-anchor="start">HEAP_HOT_UPDATED, HEAP_ONLY_TUPLE</text>
<rect class="d-box g4" x="316" y="296" width="170" height="40" rx="12"/>
<text class="d-t" x="401.0" y="321.0" text-anchor="middle">t_infomask</text>
<text class="d-s" x="500" y="313" text-anchor="start">hint bits cache commit status</text>
<text class="d-s" x="500" y="328" text-anchor="start">HEAP_XMIN_COMMITTED, HEAP_XMAX_INVALID</text>
<rect class="d-box g0" x="316" y="342" width="170" height="40" rx="12"/>
<text class="d-t" x="401.0" y="367.0" text-anchor="middle">t_hoff</text>
<text class="d-s" x="500" y="366" text-anchor="start">size of this header in bytes</text>
<rect class="d-box g0" x="316" y="388" width="170" height="40" rx="12"/>
<text class="d-t" x="401.0" y="413.0" text-anchor="middle">t_bits</text>
<text class="d-s" x="500" y="412" text-anchor="start">bitmap of NULL columns</text>
<rect class="d-box g0" x="316" y="434" width="170" height="40" rx="12"/>
<text class="d-t" x="401.0" y="459.0" text-anchor="middle">user data</text>
<text class="d-s" x="500" y="458" text-anchor="start">the actual column values</text>
<text class="d-s" x="316" y="506" text-anchor="start">Visible if xmin counts and xmax does not</text>
<path class="d-edge" d="M232,360 L288,360" marker-end="url(#mvcc-d3-ah)"/>
<text class="d-lab" x="260" y="350" text-anchor="middle">zoom in</text>
<circle class="d-badge" cx="228" cy="332" r="11"/><text class="d-bt" x="228" y="336">1</text>
<path class="d-edge" d="M316,224 C270,224 270,290 232,290" marker-end="url(#mvcc-d3-ah)"/>
<text class="d-lab" x="266" y="262" text-anchor="middle">points to</text>
<circle class="d-badge" cx="316" cy="66" r="11"/><text class="d-bt" x="316" y="70">2</text>
<circle class="d-badge" cx="316" cy="112" r="11"/><text class="d-bt" x="316" y="116">3</text>
<circle class="d-badge" cx="316" cy="204" r="11"/><text class="d-bt" x="316" y="208">4</text>
<circle class="d-badge" cx="316" cy="296" r="11"/><text class="d-bt" x="316" y="300">5</text>
</svg>
