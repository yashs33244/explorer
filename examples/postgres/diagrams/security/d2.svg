<svg class="hd" viewBox="0 0 800 400" role="img" aria-label="One login and one SELECT, step by step" xmlns="http://www.w3.org/2000/svg"><defs><marker id="security-d2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs><rect class="d-blob" x="10" y="10" width="780" height="175" rx="30"/><text class="d-s" x="770" y="34" text-anchor="end">Door and ID check</text><rect class="d-blob" x="10" y="205" width="780" height="175" rx="30"/><text class="d-s" x="770" y="229" text-anchor="end">Proof, role, permissions</text><rect class="d-box g0" x="40" y="60" width="130" height="96" rx="14"/><g transform="translate(85.0,66)"><circle class="d-line" cx="20" cy="12" r="7"/><path class="d-line" d="M6,36 C6,25 34,25 34,36 Z"/></g><text class="d-t" x="105.0" y="122" text-anchor="middle">Client connects</text><text class="d-s" x="105.0" y="141" text-anchor="middle">psql -U alice</text><rect class="d-box g1" x="240" y="60" width="130" height="96" rx="14"/><g transform="translate(285.0,66)"><path class="d-fillpaper" d="M10,30 C3,30 3,19 11,19 C12,10 27,9 29,18 C37,17 38,30 30,30 Z"/></g><text class="d-t" x="305.0" y="122" text-anchor="middle">Backend forked</text><text class="d-s" x="305.0" y="141" text-anchor="middle">postmaster, TLS?</text><rect class="d-box g3" x="440" y="60" width="130" height="96" rx="14"/><g transform="translate(485.0,66)"><path class="d-fillpaper" d="M8,3 H25 L33,11 V37 H8 Z"/><path class="d-line" d="M25,3 V11 H33"/><path class="d-lineacc" d="M13,20 H28 M13,26 H28 M13,32 H22"/></g><text class="d-t" x="505.0" y="122" text-anchor="middle">Find hba line</text><text class="d-s" x="505.0" y="141" text-anchor="middle">first match wins</text><rect class="d-box g2" x="640" y="60" width="130" height="96" rx="14"/><g transform="translate(685.0,66)"><rect class="d-fillpaper" x="7" y="17" width="26" height="19" rx="4"/><path class="d-line" d="M12,17 V12 C12,3 28,3