<svg class="hd" viewBox="0 0 800 410" role="img" aria-label="Timeline: startup carves the shared block, a backend is forked, runs a query, and may be killed" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="memory-d2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-blob" x="20" y="20" width="760" height="150" rx="30"/>
<text class="d-s" x="36" y="42">Server start, once</text>
<rect class="d-box g1" x="40" y="60" width="148" height="84" rx="14"/>
<text class="d-t" x="114" y="92" text-anchor="middle">Register</text><text class="d-m" x="114" y="116" text-anchor="middle">ShmemRequestStruct</text>
<rect class="d-box g1" x="228" y="60" width="148" height="84" rx="14"/>
<text class="d-t" x="302" y="92" text-anchor="middle">Size it</text><text class="d-m" x="302" y="116" text-anchor="middle">CalculateShmemSize</text>
<rect class="d-box g1" x="416" y="60" width="148" height="84" rx="14"/>
<text class="d-t" x="490" y="92" text-anchor="middle">Create block</text><text class="d-m" x="490" y="116" text-anchor="middle">PGSharedMemoryCreate</text>
<rect class="d-box g1" x="604" y="60" width="148" height="84" rx="14"/>
<text class="d-t" x="678" y="92" text-anchor="middle">Carve it up</text><text class="d-m" x="678" y="116" text-anchor="middle">ShmemInitStruct</text>
<path class="d-edge" d="M190,102 L222,102" marker-end="url(#memory-d2-ah)"/><text class="d-lab" x="206" y="92" text-anchor="middle">sums</text>
<path class="d-edge" d="M378,102 L410,102" marker-end="url(#memory-d2-ah)"/><text class="d-lab" x="394" y="92" text-anchor="middle">asks</text>
<path class="d-edge" d="M566,102 L598,102" marker-end="url(#memory-d2-ah)"/><text class="d-lab" x="582" y="92" text-anchor="middle">cuts</text>

<rect class="d-blob" x="20" y="230" width="760" height="150" rx="30"/>
<text class="d-s" x="764" y="252" text-anchor="end">Each client connection</text>
<rect class="d-box g0" x="40" y="270" width="148" height="84" rx="14"/>
<text class="d-t" x="114" y="302" text-anchor="middle">Fork backend</text><text class="d-m" x="114" y="326" text-anchor="middle">fork_process.c</text>
<rect class="d-box g2" x="228" y="270" width="148" height="84" rx="14"/>
<text class="d-t" x="302" y="302" text-anchor="middle">Make contexts</text><text class="d-m" x="302" y="326" text-anchor="middle">TopMemoryContext</text>
<rect class="d-box g2" x="416" y="270" width="148" height="84" rx="14"/>
<text class="d-t" x="490" y="302" text-anchor="middle">Run a query</text><text class="d-m" x="490" y="326" text-anchor="middle">ExecutorState</text>
<rect class="d-box g3" x="604" y="270" width="148" height="84" rx="14"/>
<text class="d-t" x="678" y="302" text-anchor="middle">Child killed</text><text class="d-m" x="678" y="326" text-anchor="middle">HandleChildCrash</text>
<path class="d-edge" d="M190,312 L222,312" marker-end="url(#memory-d2-ah)"/><text class="d-lab" x="206" y="302" text-anchor="middle">builds</text>
<path class="d-edge" d="M378,312 L410,312" marker-end="url(#memory-d2-ah)"/><text class="d-lab" x="394" y="302" text-anchor="middle">runs</text>
<path class="d-edge dash" d="M566,312 L598,312" marker-end="url(#memory-d2-ah)"/><text class="d-lab" x="582" y="302" text-anchor="middle">OOM</text>

<path class="d-edge acc" d="M678,146 V200 H114 V268" marker-end="url(#memory-d2-ah)"/>
<text class="d-lab" x="400" y="192" text-anchor="middle">postmaster forks</text>

<circle class="d-badge" cx="40" cy="60" r="11"/><text class="d-bt" x="40" y="64">1</text>
<circle class="d-badge" cx="228" cy="60" r="11"/><text class="d-bt" x="228" y="64">2</text>
