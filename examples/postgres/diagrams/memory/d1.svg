<svg class="hd" viewBox="0 0 800 530" role="img" aria-label="Memory map: the postmaster creates one shared block, forks backends that each keep private memory, and the OS sits underneath" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="memory-d1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-blob" x="20" y="20" width="170" height="150" rx="30"/>
<text class="d-s" x="36" y="42">Parent process</text>
<rect class="d-box g0" x="30" y="60" width="150" height="90" rx="14"/>
<g transform="translate(85,64)"><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37 M8,8 L11.5,11.5 M28.5,28.5 L32,32 M8,32 L11.5,28.5 M28.5,11.5 L32,8"/></g>
<text class="d-t" x="105" y="130" text-anchor="middle">Postmaster</text>

<rect class="d-blob" x="250" y="20" width="320" height="300" rx="30"/>
<text class="d-s" x="266" y="42">One shared block (fixed size)</text>
<rect class="d-box g1" x="262" y="62" width="140" height="50" rx="12"/><text class="d-t" x="332" y="92" text-anchor="middle">shared_buffers</text>
<rect class="d-box g1" x="418" y="62" width="140" height="50" rx="12"/><text class="d-t" x="488" y="92" text-anchor="middle">WAL buffers</text>
<rect class="d-box g1" x="262" y="132" width="140" height="50" rx="12"/><text class="d-t" x="332" y="162" text-anchor="middle">SLRU caches</text>
<rect class="d-box g1" x="418" y="132" width="140" height="50" rx="12"/><text class="d-t" x="488" y="162" text-anchor="middle">Lock tables</text>
<rect class="d-box g1" x="262" y="202" width="140" height="50" rx="12"/><text class="d-t" x="332" y="232" text-anchor="middle">ProcArray</text>
<rect class="d-box g1" x="418" y="202" width="140" height="50" rx="12"/><text class="d-t" x="488" y="232" text-anchor="middle">Shared stats</text>
<text class="d-s" x="410" y="290" text-anchor="middle">DSM segments come and go</text>

<rect class="d-blob" x="620" y="20" width="160" height="300" rx="30"/>
<text class="d-s" x="636" y="42">Private to one backend</text>
<rect class="d-box g0" x="630" y="58" width="140" height="40" rx="12"/><text class="d-t" x="700" y="83" text-anchor="middle">Backend</text>
<rect class="d-box g2" x="630" y="148" width="140" height="40" rx="12"/><text class="d-t" x="700" y="173" text-anchor="middle">TopMemoryContext</text>
<rect class="d-box g2" x="630" y="238" width="140" height="52" rx="12"/><text class="d-t" x="700" y="260" text-anchor="middle">ExecutorState</text><text class="d-s" x="700" y="278" text-anchor="middle">sorts, hashes</text>

<rect class="d-blob" x="20" y="400" width="760" height="110" rx="30"/>
<text class="d-s" x="36" y="422">Operating system</text>
<rect class="d-box g4" x="262" y="440" width="120" height="56" rx="12"/><text class="d-t" x="322" y="473" text-anchor="middle">Page cache</text>
<rect class="d-box g5" x="470" y="440" width="120" height="56" rx="12"/><text class="d-t" x="530" y="473" text-anchor="middle">Disk files</text>
<rect class="d-box g3" x="640" y="440" width="130" height="56" rx="12"/><text class="d-t" x="705" y="473" text-anchor="middle">OOM killer</text>
<g transform="translate(60,440)"><path class="d-fillpaper" d="M5,9 V31 C5,36 35,36 35,31 V9"/><ellipse class="d-fillpaper" cx="20" cy="9" rx="15" ry="5"/><path class="d-lineacc" d="M5,20 C5,25 35,25 35,20"/></g>
<text class="d-s" x="110" y="465">data files</text><text class="d-s" x="110" y="483">live here</text>

<path class="d-edge acc" d="M192,105 L246,105" marker-end="url(#memory-d1-ah)"/>
<text class="d-lab" x="219" y="95" text-anchor="middle">creates</text>
<circle class="d-badge" cx="219" cy="120" r="11"/><text class="d-bt" x="219" y="124">1</text>

<path class="d-edge acc" d="M105,172 V385 H312 q10,-14 20,0 H660 V324" marker-end="url(#memory-d1-ah)"/>
<text class="d-lab" x="520" y="377" text-anchor="middle">forks</text>
<circle class="d-badge" cx="590" cy="385" r="11"/><text class="d-bt" x="590" y="389">2</text>

<path class="d-edge acc" d="M630,78 L574,78" marker-end="url(#memory-d1-ah)"/>
<text class="d-lab" x="602" y="68" text-anchor="middle">maps</text>
<circle class="d-badge" cx="602" cy="96" r="11"/><text class="d-bt" x="602" y="100">3</text>

<path class="d-edge" d="M700,98 V146" marker-end="url(#memory-d1-ah)"/>
<text class="d-lab" x="712" y="127">allocates</text>
<circle class="d-badge" cx="700" cy="112" r="11"/><text class="d-bt" x="700" y="116">4</text>

<path class="d-edge" d="M700,188 V236" marker-end="url(#memory-d1-ah)"/>
<text class="d-lab" x="712" y="217">nests</text>

<path class="d-edge" d="M322,322 V438" marker-end="url(#memory-d1-ah)"/>
<text class="d-lab" x="340" y="432">read/write</text>
<circle class="d-badge" cx="322" cy="412" r="11"/><text class="d-bt" x="322" y="416">5</text>

<path class="d-edge" d="M384,468 L468,468" marker-end="url(#memory-d1-ah)"/>
<text class="d-lab" x="426" y="458" text-anchor="middle">flushes</text>

<path class="d-edge dash" d="M740,438 V324" marker-end="url(#memory-d1-ah)"/>
<text class="d-lab" x="730" y="408" text-anchor="end">SIGKILL</text>
<circle class="d-badge" cx="740" cy="418" r="11"/><text class="d-bt" x="740" y="422">6</text>
</svg>
