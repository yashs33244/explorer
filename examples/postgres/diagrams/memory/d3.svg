<svg class="hd" viewBox="0 0 800 550" role="img" aria-label="The memory context tree of one backend, colored by how long each context lives" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="memory-d3-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-box g1" x="30" y="24" width="190" height="38" rx="12"/><text class="d-t" x="125" y="48" text-anchor="middle">TopMemoryContext</text>
<circle class="d-badge" cx="236" cy="43" r="11"/><text class="d-bt" x="236" y="47">1</text>
<text class="d-s" x="360" y="48">root, lives as long as the backend</text>
<path class="d-edge" d="M45,62 V303"/>
<path class="d-edge" d="M45,95 H58" marker-end="url(#memory-d3-ah)"/>
<path class="d-edge" d="M45,147 H58" marker-end="url(#memory-d3-ah)"/>
<path class="d-edge" d="M45,199 H58" marker-end="url(#memory-d3-ah)"/>
<path class="d-edge" d="M45,251 H58" marker-end="url(#memory-d3-ah)"/>
<path class="d-edge" d="M45,303 H58" marker-end="url(#memory-d3-ah)"/>
<rect class="d-box g1" x="60" y="76" width="190" height="38" rx="12"/><text class="d-t" x="155" y="100" text-anchor="middle">ErrorContext</text>
<circle class="d-badge" cx="266" cy="95" r="11"/><text class="d-bt" x="266" y="99">1</text>
<text class="d-s" x="360" y="100">kept ready for error handling</text>
<rect class="d-box g1" x="60" y="128" width="190" height="38" rx="12"/><text class="d-t" x="155" y="152" text-anchor="middle">CacheMemoryContext</text>
<circle class="d-badge" cx="266" cy="147" r="11"/><text class="d-bt" x="266" y="151">1</text>
<text class="d-s" x="360" y="152">catalog caches</text>
<rect class="d-box g2" x="60" y="180" width="190" height="38" rx="12"/><text class="d-t" x="155" y="204" text-anchor="middle">MessageContext</text>
<circle class="d-badge" cx="266" cy="199" r="11"/><text class="d-bt" x="266" y="203">2</text>
<text class="d-s" x="360" y="204">holds one client command</text>
<rect class="d-box g3" x="60" y="232" width="190" height="38" rx="12"/><text class="d-t" x="155" y="256" text-anchor="middle">TopTransactionContext</text>
<circle class="d-badge" cx="266" cy="251" r="11"/><text class="d-bt" x="266" y="255">3</text>
<text class="d-s" x="360" y="256">freed at commit or abort</text>
<rect class="d-box g1" x="60" y="284" width="190" height="38" rx="12"/><text class="d-t" x="155" y="308" text-anchor="middle">TopPortalContext</text>
<circle class="d-badge" cx="266" cy="303" r="11"/><text class="d-bt" x="266" y="307">1</text>
<text class="d-s" x="360" y="308">parent of all portals</text>

<path class="d-edge" d="M75,322 V355"/><path class="d-edge" d="M75,355 H98" marker-end="url(#memory-d3-ah)"/>
<rect class="d-box g4" x="100" y="336" width="150" height="38" rx="12"/><text class="d-t" x="175" y="360" text-anchor="middle">PortalContext</text>
<circle class="d-badge" cx="266" cy="355" r="11"/><text class="d-bt" x="266" y="359">4</text>
<text class="d-s" x="360" y="360">one per open portal</text>

<path class="d-edge" d="M115,374 V407"/><path class="d-edge" d="M115,407 H138" marker-end="url(#memory-d3-ah)"/>
<rect class="d-box g4" x="140" y="388" width="150" height="38" rx="12"/><text class="d-t" x="215" y="412" text-anchor="middle">ExecutorState</text>
<circle class="d-badge" cx="306" cy="407" r="11"/><text class="d-bt" x="306" y="411">4</text>
<text class="d-s" x="360" y="411">per query run</text>

<path class="d-edge" d="M155,426 V459"/><path class="d-edge" d="M155,459 H178" marker-end="url(#memory-d3-ah)"/>
<rect class="d-box g5" x="180" y="440" width="130" height="38" rx="12"/><text class="d-t" x="245" y="464" text-anchor="middle">ExprContext</text>
<circle class="d-badge" cx="326" cy="459" r="11"/><text class="d-bt" x="326" y="463">5</text>
<text class="d-s" x="360" y="463">reset for every row</text>

<rect class="d-blob2" x="590" y="20" width="190" height="200" rx="26"/>
<text class="d-s" x="606" y="44">Badge = lifetime</text>
<circle class="d-badge" cx="612" cy="72" r="11"/><text class="d-bt" x="612" y="76">1</text><text class="d-s" x="632" y="76">whole backend</text>
<circle class="d-badge" cx="612" cy="102" r="11"/><text class="d-bt" x="612" y="106">2</text><text class="d-s" x="632" y="106">one command</text>
<circle class="d-badge" cx="612" cy="132" r="11"/><text class="d-bt" x="612" y="136">3</text><text class="d-s" x="632" y="136">one transaction</text>
<circle class="d-badge" cx="612" cy="162" r="11"/><text class="d-bt" x="612" y="166">4</text><text class="d-s" x="632" y="166">one query</text>
<circle class="d-badge" cx="612" cy="192" r="11"/><text class="d-bt" x="612" y="196">5</text><text class="d-s" x="632" y="196">one row</text>
<path class="d-edge dash" d="M558,392 H294" marker-end="url(#memory-d3-ah)"/>
<text class="d-lab" x="430" y="384" text-anchor="middle">live in</text>
<rect class="d-blob2" x="560" y="330" width="220" height="150" rx="30"/>
<g transform="translate(650,340)"><rect class="d-fillpaper" x="5" y="4" width="30" height="32" rx="3"/><path class="d-lineacc" d="M5,12 H35"/><rect class="d-fillacc" x="10" y="17" width="20" height="4" rx="1"/><rect class="d-fillacc" x="10" y="24" width="14" height="4" rx="1"/></g>
<text class="d-t" x="670" y="404" text-anchor="middle">Sort and hash nodes</text>
<text class="d-s" x="670" y="426" text-anchor="middle">budget: work_mem</text>
<text class="d-s" x="670" y="446" text-anchor="middle">over budget: temp files</text>

<rect class="d-blob" x="30" y="496" width="740" height="40" rx="20"/>
<text class="d-t" x="400" y="521" text-anchor="middle">MemoryContextReset() frees a context and everything under it.</text>
</svg>
