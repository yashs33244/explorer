<svg class="hd" viewBox="0 0 800 600" role="img" aria-label="Timeline of one table lock conflict: grant, wait, deadlock check, release, wake" xmlns="http://www.w3.org/2000/svg"><defs><marker id="locks-d2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-blob" x="15" y="12" width="210" height="568" rx="30"/><text class="d-s" x="120" y="34" text-anchor="middle">Backend A (holder)</text>
<rect class="d-blob" x="295" y="12" width="210" height="568" rx="30"/><text class="d-s" x="400" y="34" text-anchor="middle">Lock manager (shared memory)</text>
<rect class="d-blob" x="575" y="12" width="210" height="568" rx="30"/><text class="d-s" x="680" y="34" text-anchor="middle">Backend B (waiter)</text>
<rect class="d-box g2" x="25" y="50" width="190" height="46" rx="12"/><text class="d-t" x="59" y="70">ALTER TABLE t</text><text class="d-s" x="59" y="86">AccessExclusiveLock</text>
<circle class="d-badge" cx="42" cy="73" r="11"/><text class="d-bt" x="42" y="77">1</text>
<rect class="d-box g1" x="305" y="108" width="190" height="46" rx="12"/><text class="d-t" x="339" y="128">Lock granted</text><text class="d-s" x="339" y="144">LockAcquireExtended</text>
<circle class="d-badge" cx="322" cy="131" r="11"/><text class="d-bt" x="322" y="135">2</text>
<rect class="d-box g2" x="585" y="166" width="190" height="46" rx="12"/><text class="d-t" x="619" y="186">SELECT * FROM t</text><text class="d-s" x="619" y="202">wants AccessShareLock</text>
<circle class="d-badge" cx="602" cy="189" r="11"/><text class="d-bt" x="602" y="193">3</text>
<rect class="d-box g4" x="305" y="224" width="190" height="46" rx="12"/><text class="d-t" x="339" y="244">Conflict found</text><text class="d-s" x="339" y="260">LockCheckConflicts</text>
<circle class="d-badge" cx="322" cy="247" r="11"/><text class="d-bt" x="322" y="251">4</text>
<rect class="d-box g4" x="585" y="282" width="190" height="46" rx="12"/><text class="d-t" x="619" y="302">Sleeps in queue</text><text class="d-s" x="619" y="318">JoinWaitQueue</text>
<circle class="d-badge" cx="602" cy="305" r="11"/><text class="d-bt" x="602" y="309">5</text>
<rect class="d-box g4" x="305" y="340" width="190" height="46" rx="12"/><text class="d-t" x="339" y="360">Deadlock check</text><text class="d-s" x="339" y="376">CheckDeadLock, no cycle</text>
<circle class="d-badge" cx="322" cy="363" r="11"/><text class="d-bt" x="322" y="367">6</text>
<rect class="d-box g2" x="25" y="398" width="190" height="46" rx="12"/><text class="d-t" x="59" y="418">COMMIT</text><text class="d-s" x="59" y="434">LockReleaseAll</text>
<circle class="d-badge" cx="42" cy="421" r="11"/><text class="d-bt" x="42" y="425">7</text>
<rect class="d-box g1" x="305" y="456" width="190" height="46" rx="12"/><text class="d-t" x="339" y="476">Grant and wake</text><text class="d-s" x="339" y="492">ProcWakeup, SetLatch</text>
<circle class="d-badge" cx="322" cy="479" r="11"/><text class="d-bt" x="322" y="483">8</text>
<rect class="d-box g2" x="585" y="514" width="190" height="46" rx="12"/><text class="d-t" x="619" y="534">SELECT runs</text><text class="d-s" x="619" y="550">lock now granted</text>
<circle class="d-badge" cx="602" cy="537" r="11"/><text class="d-bt" x="602" y="541">9</text>
<path class="d-edge acc" d="M215,73 C260.0,73 260.0,131 305,131" marker-end="url(#locks-d2-ah)"/><text class="d-lab" x="260.0" y="106.0" text-anchor="middle">requests</text>
<path class="d-edge acc" d="M585,189 C540.0,189 540.0,236 495,236" marker-end="url(#locks-d2-ah)"/><text class="d-lab" x="540.0" y="216.0" text-anchor="middle">requests</text>
<path class="d-edge acc" d="M495,258 C540.0,258 540.0,294 585,294" marker-end="url(#locks-d2-ah)"/><text class="d-lab" x="540.0" y="280.0" text-anchor="middle">must wait</text>
<path class="d-edge acc" d="M585,316 C540.0,316 540.0,352 495,352" marker-end="url(#locks-d2-ah)"/><text class="d-lab" x="540.0" y="338.0" text-anchor="middle">after 1s</text>
<path class="d-edge acc" d="M215,421 C260.0,421 260.0,479 305,479" marker-end="url(#locks-d2-ah)"/><text class="d-lab" x="260.0" y="454.0" text-anchor="middle">releases</text>
<path class="d-edge acc" d="M495,479 C540.0,479 540.0,537 585,537" marker-end="url(#locks-d2-ah)"/><text class="d-lab" x="540.0" y="512.0" text-anchor="middle">wakes</text>
</svg>
