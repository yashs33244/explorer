<svg class="hd" viewBox="0 0 800 530" role="img" aria-label="Catalog tables on disk feed the syscache and relcache in memory, which supply fmgr, which loads extensions that use memory contexts and error handling" xmlns="http://www.w3.org/2000/svg">
