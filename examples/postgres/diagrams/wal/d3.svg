<svg class="hd" viewBox="0 0 800 530" role="img" aria-label="Anatomy of a WAL record inside a WAL segment file" xmlns="http://www.w3.org/2000/svg"><defs><marker id="wal-d3-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<circle class="d-badge" cx="26" cy="26" r="11"/><text class="d-bt" x="26" y="30">1</text><text class="d-t" x="44" y="30" text-anchor="start">WAL segment file: pg_wal/000000010000000000000001 (16MB)</text><rect class="d-box g3" x="40" y="44" width="95" height="48" rx="8"/><text class="d-t" x="87.5" y="73" text-anchor="middle">page 0</text><rect class="d-box g3" x="143" y="44" width="95" height="48" rx="8"/><text class="d-t" x="190.5" y="73" text-anchor="middle">page 1</text><rect class="d-box g3" x="246" y="44" width="95" height="48" rx="8"/><text class="d-t" x="293.5" y="73" text-anchor="middle">page 2</text><rect class="d-box g3" x="349" y="44" width="95" height="48" rx="8"/><text class="d-t" x="396.5" y="73" text-anchor="middle">page 3</text><rect class="d-box g3" x="452" y="44" width="95" height="48" rx="8"/><text class="d-t" x="499.5" y="73" text-anchor="middle">page 4</text><rect class="d-box g3" x="555" y="44" width="95" height="48" rx="8"/><text class="d-t" x="602.5" y="73" text-anchor="middle">...</text><rect class="d-box g2" x="658" y="44" width="95" height="48" rx="8"/><text class="d-t" x="705.5" y="73" text-anchor="middle">page 2047</text><path class="d-edge acc" d="M702,94 V148" marker-end="url(#wal-d3-ah)"/><text class="d-lab" x="690" y="126" text-anchor="end">one 8kB page</text><circle class="d-badge" cx="26" cy="136" r="11"/><text class="d-bt" x="26" y="140">2</text><text class="d-t" x="44" y="140" text-anchor="start">One WAL page: XLOG_BLCKSZ = 8kB</text><rect class="d-box g4" x="40" y="150" width="190" height="66" rx="8"/><text class="d-t" x="135.0" y="174" text-anchor="middle">XLogPageHeaderData</text><text class="d-s" x="135.0" y="192" text-anchor="middle">xlp_magic, xlp_pageaddr</text><rect class="d-box g1" x="230" y="150" width="170" height="66" rx="8"/><text class="d-t" x="315.0" y="174" text-anchor="middle">WAL record</text><text class="d-s" x="315.0" y="192" text-anchor="middle">starts at an LSN</text><rect class="d-box g1" x="400" y="150" width="190" height="66" rx="8"/><text class="d-t" x="495.0" y="174" text-anchor="middle">WAL record</text><text class="d-s" x="495.0" y="192" text-anchor="middle">starts at an LSN</text><rect class="d-box g2" x="590" y="150" width="170" height="66" rx="8"/><text class="d-t" x="675.0" y="174" text-anchor="middle">WAL record</text><text class="d-s" x="675.0" y="192" text-anchor="middle">continues next page</text><path class="d-edge acc" d="M675,218 V288" marker-end="url(#wal-d3-ah)"/><text class="d-lab" x="663" y="258" text-anchor="end">zoom in</text><circle class="d-badge" cx="26" cy="276" r="11"/><text class="d-bt" x="26" y="280">3</text><text class="d-t" x="44" y="280" text-anchor="start">One record, split into parts</text><rect class="d-box g2" x="40" y="290" width="130" height="66" rx="8"/><text class="d-t" x="105.0" y="314" text-anchor="middle">XLogRecord</text><text class="d-s" x="105.0" y="332" text-anchor="middle">24 byte header</text><rect class="d-box g1" x="170" y="290" width="150" height="66" rx="8"/><text class="d-t" x="245.0" y="314" text-anchor="middle">Block header</text><text class="d-s" x="245.0" y="332" text-anchor="middle">XLogRecordBlockHeader</text><rect class="d-box g1" x="320" y="290" width="130" height="66" rx="8"/><text class="d-t" x="385.0" y="314" text-anchor="middle">Main data hdr</text><text class="d-s" x="385.0" y="332" text-anchor="middle">id + data_length</text><rect class="d-box g3" x="450" y="290" width="170" height="66" rx="8"/><text class="d-t" x="535.0" y="314" text-anchor="middle">Block image/data</text><text class="d-s" x="535.0" y="332" text-anchor="middle">page image or tuple</text><rect class="d-box g4" x="620" y="290" width="140" height="66" rx="8"/><text class="d-t" x="690.0" y="314" text-anchor="middle">Main data</text><text class="d-s" x="690.0" y="332" text-anchor="middle">e.g. xl_heap_insert</text><path class="d-edge acc" d="M105,358 V428" marker-end="url(#wal-d3-ah)"/><text class="d-lab" x="117" y="398" text-anchor="start">zoom in</text><circle class="d-badge" cx="774" cy="416" r="11"/><text class="d-bt" x="774" y="420">4</text><text class="d-t" x="756" y="420" text-anchor="end">XLogRecord header fields (24 bytes)</text><rect class="d-box g0" x="40" y="430" width="110" height="74" rx="8"/><text class="d-t" x="95.0" y="454" text-anchor="middle">xl_tot_len</text><text class="d-s" x="95.0" y="472" text-anchor="middle">4 bytes</text><text class="d-s" x="95.0" y="488" text-anchor="middle">record size</text><rect class="d-box g0" x="150" y="430" width="100" height="74" rx="8"/><text class="d-t" x="200.0" y="454" text-anchor="middle">xl_xid</text><text class="d-s" x="200.0" y="472" text-anchor="middle">4 bytes</text><text class="d-s" x="200.0" y="488" text-anchor="middle">transaction</text><rect class="d-box g0" x="250" y="430" width="140" height="74" rx="8"/><text class="d-t" x="320.0" y="454" text-anchor="middle">xl_prev</text><text class="d-s" x="320.0" y="472" text-anchor="middle">8 bytes</text><text class="d-s" x="320.0" y="488" text-anchor="middle">previous LSN</text><rect class="d-box g0" x="390" y="430" width="95" height="74" rx="8"/><text class="d-t" x="437.5" y="454" text-anchor="middle">xl_info</text><text class="d-s" x="437.5" y="472" text-anchor="middle">1 byte</text><text class="d-s" x="437.5" y="488" text-anchor="middle">flags</text><rect class="d-box g2" x="485" y="430" width="100" height="74" rx="8"/><text class="d-t" x="535.0" y="454" text-anchor="middle">xl_rmid</text><text class="d-s" x="535.0" y="472" text-anchor="middle">1 byte</text><text class="d-s" x="535.0" y="488" text-anchor="middle">owner rmgr</text><rect class="d-box g0" x="585" y="430" width="55" height="74" rx="8"/><text class="d-t" x="612.5" y="454" text-anchor="middle">pad</text><text class="d-s" x="612.5" y="472" text-anchor="middle">2 bytes</text><rect class="d-box g0" x="640" y="430" width="120" height="74" rx="8"/><text class="d-t" x="700.0" y="454" text-anchor="middle">xl_crc</text><text class="d-s" x="700.0" y="472" text-anchor="middle">4 bytes</text><text class="d-s" x="700.0" y="488" text-anchor="middle">checksum</text>
</svg>
