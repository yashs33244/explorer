<rect class="d-box g1" x="220" y="175" width="150" height="52" rx="14"/><text class="d-t" x="295.0" y="197" text-anchor="middle">Open the scan</text><text class="d-s" x="295.0" y="215" text-anchor="middle">index_beginscan</text><circle class="d-badge" cx="222" cy="177" r="11"/><text class="d-bt" x="222" y="181">2</text>
<rect class="d-box g4" x="410" y="255" width="165" height="52" rx="14"/><text class="d-t" x="492.5" y="277" text-anchor="middle">Walk root to leaf</text><text class="d-s" x="492.5" y="295" text-anchor="middle">_bt_first</text><circle class="d-badge" cx="412" cy="257" r="11"/><text class="d-bt" x="412" y="261">3</text>
<rect class="d-box g1" x="220" y="335" width="150" height="52" rx="14"/><text class="d-t" x="295.0" y="357" text-anchor="middle">Receive a TID</text><text class="d-s" x="295.0" y="375" text-anchor="middle">xs_heaptid</text><circle class="d-badge" cx="222" cy="337" r="11"/><text class="d-bt" x="222" y="341">4</text>
<rect class="d-box g3" x="610" y="415" width="165" height="52" rx="14"/><text class="d-t" x="692.5" y="437" text-anchor="middle">Read heap page</text><text class="d-s" x="692.5" y="455" text-anchor="middle">heap_hot_search_buffer</text><circle class="d-badge" cx="612" cy="417" r="11"/><text class="d-bt" x="612" y="421">5</text>
<rect class="d-box g1" x="220" y="495" width="150" height="52" rx="14"/><text class="d-t" x="295.0" y="517" text-anchor="middle">Recheck, return</text><text class="d-s" x="295.0" y="535" text-anchor="middle">IndexNext</text><circle class="d-badge" cx="222" cy="497" r="11"/><text class="d-bt" x="222" y="501">6</text>
