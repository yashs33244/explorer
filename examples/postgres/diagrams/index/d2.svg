<svg class="hd" viewBox="0 0 800 600" role="img" aria-label="Time-ordered steps of SELECT ... WHERE id = 42 using a btree index scan, from planner to client" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="index-d2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-blob" x="15" y="15" width="180" height="575" rx="28"/><text class="d-t" x="105.0" y="44" text-anchor="middle">Planner</text>
<rect class="d-blob" x="205" y="15" width="180" height="575" rx="28"/><text class="d-t" x="295.0" y="44" text-anchor="middle">Executor</text>
<rect class="d-blob" x="395" y="15" width="195" height="575" rx="28"/><text class="d-t" x="492.5" y="44" text-anchor="middle">Index file (btree)</text>
