<g><circle class="d-badge" cx="302" cy="288" r="11"/><text class="d-bt" x="302" y="292">4</text></g>
<g><circle class="d-badge" cx="560" cy="250" r="11"/><text class="d-bt" x="560" y="254">5</text></g>
<g><circle class="d-badge" cx="375" cy="428" r="11"/><text class="d-bt" x="375" y="432">6</text></g>
</svg>
