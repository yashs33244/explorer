<svg class="hd" viewBox="0 0 800 530" role="img" aria-label="A client query reaches a coordinator whose partitioned table is pruned, then postgres_fdw sends SQL to shard servers" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="scaling-d1-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-blob" x="15" y="30" width="170" height="300" rx="36"/>
<text class="d-s" x="100" y="54" text-anchor="middle">Outside core</text>
<rect class="d-blob" x="210" y="30" width="330" height="380" rx="36"/>
<text class="d-s" x="375" y="54" text-anchor="middle">Coordinator server</text>
<rect class="d-blob" x="580" y="30" width="205" height="380" rx="36"/>
<text class="d-s" x="682" y="54" text-anchor="middle">Shard servers</text>
<rect class="d-blob2" x="210" y="430" width="330" height="90" rx="30"/>
<rect class="d-box g0" x="25" y="75" width="150" height="62" rx="14"/>
<g transform="translate(32,87) scale(0.8)"><circle class="d-line" cx="20" cy="12" r="7"/><path class="d-line" d="M6,36 C6,25 34,25 34,36 Z"/></g>
<text class="d-t" x="72" y="112">Client app</text>
<rect class="d-box g1" x="25" y="215" width="150" height="62" rx="14"/>
<g transform="translate(32,227) scale(0.8)"><rect class="d-fillpaper" x="4" y="4" width="32" height="10" rx="3"/><rect class="d-fillpaper" x="4" y="16" width="32" height="10" rx="3"/><circle class="d-fillacc" cx="10" cy="9" r="1.8"/><circle class="d-fillacc" cx="10" cy="21" r="1.8"/></g>
<text class="d-t" x="72" y="244">pgbouncer</text><text class="d-s" x="72" y="262">not in core</text>
<rect class="d-box g2" x="240" y="80" width="270" height="62" rx="14"/>
<g transform="translate(248,91) scale(0.8)"><rect class="d-fillpaper" x="5" y="4" width="30" height="32" rx="3"/><path class="d-lineacc" d="M5,12 H35"/><rect class="d-fillacc" x="10" y="17" width="20" height="4" rx="1"/></g>
<text class="d-t" x="286" y="107">orders</text><text class="d-s" x="286" y="127">PARTITION BY LIST (region)</text>
<rect class="d-box g3" x="240" y="190" width="125" height="62" rx="14"/>
<text class="d-t" x="302" y="217" text-anchor="middle">Pruning</text><text class="d-s" x="302" y="237" text-anchor="middle">partprune.c</text>
<rect class="d-box g3" x="385" y="190" width="125" height="62" rx="14"/>
<text class="d-t" x="447" y="217" text-anchor="middle">Bounds</text><text class="d-s" x="447" y="237" text-anchor="middle">partbounds.c</text>
<rect class="d-box g4" x="240" y="320" width="270" height="62" rx="14"/>
<g transform="translate(248,331) scale(0.8)"><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37"/></g>
<text class="d-t" x="286" y="347">postgres_fdw</text><text class="d-s" x="286" y="367">contrib, builds Remote SQL</text>
<rect class="d-box g5" x="600" y="80" width="165" height="80" rx="14"/>
<g transform="translate(608,100)"><path class="d-fillpaper" d="M5,9 V31 C5,36 35,36 35,31 V9"/><ellipse class="d-fillpaper" cx="20" cy="9" rx="15" ry="5"/><path class="d-lineacc" d="M5,20 C5,25 35,25 35,20"/></g>
<text class="d-t" x="656" y="116">Shard 1</text><text class="d-s" x="656" y="136">orders_s1 (eu)</text>
<rect class="d-box g5" x="600" y="260" width="165" height="80" rx="14"/>
<g transform="translate(608,280)"><path class="d-fillpaper" d="M5,9 V31 C5,36 35,36 35,31 V9"/><ellipse class="d-fillpaper" cx="20" cy="9" rx="15" ry="5"/><path class="d-lineacc" d="M5,20 C5,25 35,25 35,20"/></g>
<text class="d-t" x="656" y="296">Shard 2</text><text class="d-s" x="656" y="316">orders_s2 (us)</text>
<rect class="d-box g1" x="240" y="450" width="270" height="52" rx="14"/>
<g transform="translate(248,456) scale(0.8)"><path class="d-fillpaper" d="M5,9 V31 C5,36 35,36 35,31 V9"/><ellipse class="d-fillpaper" cx="20" cy="9" rx="15" ry="5"/><path class="d-lineacc" d="M5,20 C5,25 35,25 35,20"/></g>
<text class="d-t" x="290" y="474">Streaming replica</text><text class="d-s" x="290" y="492">full copy, reads only</text>
<path class="d-edge" d="M100,137 L100,215" marker-end="url(#scaling-d1-ah)"/><text class="d-lab" x="100" y="180" text-anchor="middle">connects</text>
<path class="d-edge" d="M175,246 C205,246 210,125 240,115" marker-end="url(#scaling-d1-ah)"/><text class="d-lab" x="198" y="200" text-anchor="middle">sends SQL</text>
<path class="d-edge" d="M302,142 L302,190" marker-end="url(#scaling-d1-ah)"/><text class="d-lab" x="300" y="166" text-anchor="end">asks</text>
<path class="d-edge" d="M447,142 L447,190" marker-end="url(#scaling-d1-ah)"/><text class="d-lab" x="452" y="166">reads</text>
<path class="d-edge acc" d="M302,252 L302,320" marker-end="url(#scaling-d1-ah)"/><text class="d-lab" x="320" y="290">keeps scans</text>
<path class="d-edge acc" d="M510,340 C550,340 560,125 600,125" marker-end="url(#scaling-d1-ah)"/><text class="d-lab" x="548" y="200" text-anchor="middle">Remote SQL</text>
<path class="d-edge acc" d="M510,358 C550,358 560,305 600,305" marker-end="url(#scaling-d1-ah)"/>
<path class="d-edge dash" d="M375,410 L375,450" marker-end="url(#scaling-d1-ah)"/><text class="d-lab" x="394" y="434">streams WAL</text>
<g><circle class="d-badge" cx="100" cy="158" r="11"/><text class="d-bt" x="100" y="162">1</text></g>
<g><circle class="d-badge" cx="213" cy="170" r="11"/><text class="d-bt" x="213" y="174">2</text></g>
