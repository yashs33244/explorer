<svg class="hd" viewBox="0 0 800 535" role="img" aria-label="Layout of the data directory and which tool touches each part" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ops-d3-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs><rect class="d-blob" x="20" y="15" width="400" height="500" rx="34"/><rect class="d-blob" x="440" y="15" width="340" height="500" rx="34"/><text class="d-t" x="40" y="45">$PGDATA (data directory)</text><text class="d-t" x="460" y="45">Who touches it</text><rect class="d-box g1" x="40" y="62" width="360" height="40" rx="12"/><g transform="translate(48,68) scale(0.7)"><path class="d-fillpaper" d="M8,3 H25 L33,11 V37 H8 Z"/><path class="d-line" d="M25,3 V11 H33"/><path class="d-lineacc" d="M13,20 H28 M13,26 H28 M13,32 H22"/></g><text class="d-m" x="84" y="87">postgresql.conf</text><path class="d-edge dash" d="M402,82 L452,82" marker-end="url(#ops-d3-ah)"/><rect class="d-box g1" x="456" y="62" width="310" height="40" rx="12"/><text class="d-t" x="470" y="79">you edit it</text><text class="d-s" x="470" y="95">reload re-reads it</text><rect class="d-box g1" x="40" y="110" width="360" height="40" rx="12"/><g transform="translate(48,116) scale(0.7)"><path class="d-fillpaper" d="M8,3 H25 L33,11 V37 H8 Z"/><path class="d-line" d="M25,3 V11 H33"/><path class="d-lineacc" d="M13,20 H28 M13,26 H28 M13,32 H22"/></g><text class="d-m" x="84" y="135">postgresql.auto.conf</text><path class="d-edge dash" d="M402,130 L452,130" marker-end="url(#ops-d3-ah)"/><rect class="d-box g1" x="456" y="110" width="310" height="40" rx="12"/><text class="d-t" x="470" y="127">ALTER SYSTEM</text><text class="d-s" x="470" y="143">writes it, wins over .conf</text><rect class="d-box g2" x="40" y="158" width="360" height="40" rx="12"/><g transform="translate(48,164) scale(0.7)"><path class="d-fillpaper" d="M4,10 H16 L20,15 H36 V34 H4 Z"/><path class="d-lineacc" d