<svg class="hd" viewBox="0 0 800 495" role="img" aria-label="Architecture of parse, analyze and rewrite: SQL text flows through scanner, grammar, analyzer and rewriter, reading the system catalogs, then goes to the planner" xmlns="http://www.w3.org/2000/svg">
