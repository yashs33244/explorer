<svg class="hd" viewBox="0 0 800 450" role="img" aria-label="Lifecycle of SELECT price FROM items WHERE price > 5 through scan, grammar, analysis, rewrite and planner" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="parse-d2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-blob" x="12" y="20" width="776" height="140" rx="30"/>
<text class="d-s" x="32" y="42">Raw parse: grammar only, no catalog</text>
<rect class="d-blob" x="12" y="190" width="776" height="140" rx="30"/>
<text class="d-s" x="32" y="212">Analyze and rewrite: names are looked up</text>
<!-- row 1 -->
<rect class="d-box g0" x="30" y="60" width="150" height="76" rx="14"/><text class="d-t" x="105" y="94" text-anchor="middle">Receive SQL</text><text class="d-s" x="105" y="116" text-anchor="middle">exec_simple_query</text>
<rect class="d-box g1" x="230" y="60" width="150" height="76" rx="14"/><text class="d-t" x="305" y="94" text-anchor="middle">Start raw parse</text><text class="d-s" x="305" y="116" text-anchor="middle">raw_parser</text>
<rect class="d-box g1" x="430" y="60" width="150" height="76" rx="14"/><text class="d-t" x="505" y="94" text-anchor="middle">Scan to tokens</text><text class="d-s" x="505" y="116" text-anchor="middle">scan.l (flex)</text>
<rect class="d-box g2" x="630" y="60" width="150" height="76" rx="14"/><text class="d-t" x="705" y="94" text-anchor="middle">Build raw tree</text><text class="d-s" x="705" y="116" text-anchor="middle">gram.y SelectStmt</text>
<path class="d-edge acc" d="M180,98 H228" marker-end="url(#parse-d2-ah)"/><text class="d-lab" x="204" y="90" text-anchor="middle">calls</text>
<path class="d-edge acc" d="M380,98 H428" marker-end="url(#parse-d2-ah)"/><text class="d-lab" x="404" y="90" text-anchor="middle">runs</text>
<path class="d-edge acc" d="M580,98 H628" marker-end="url(#parse-d2-ah)"/><text class="d-lab" x="604" y="90" text-anchor="middle">emits</text>
<!-- row 2 -->
<rect class="d-box g3" x="630" y="230" width="150" height="76" rx="14"/><text class="d-t" x="705" y="264" text-anchor="middle">Start analysis</text><text class="d-s" x="705" y="286" text-anchor="middle">transformStmt</text>
<rect class="d-box g3" x="430" y="230" width="150" height="76" rx="14"/><text class="d-t" x="505" y="264" text-anchor="middle">Read FROM first</text><text class="d-s" x="505" y="286" text-anchor="middle">transformFromClause</text>
<rect class="d-box g3" x="230" y="230" width="150" height="76" rx="14"/><text class="d-t" x="305" y="264" text-anchor="middle">Name to Var</text><text class="d-s" x="305" y="286" text-anchor="middle">colNameToVar</text>
<rect class="d-box g4" x="30" y="230" width="150" height="76" rx="14"/><text class="d-t" x="105" y="264" text-anchor="middle">Expand views</text><text class="d-s" x="105" y="286" text-anchor="middle">fireRIRrules</text>
<path class="d-edge acc" d="M705,136 V228" marker-end="url(#parse-d2-ah)"/><text class="d-lab" x="705" y="186" text-anchor="middle">passes</text>
<path class="d-edge acc" d="M630,268 H582" marker-end="url(#parse-d2-ah)"/><text class="d-lab" x="606" y="260" text-anchor="middle">opens</text>
<path class="d-edge acc" d="M430,268 H382" marker-end="url(#parse-d2-ah)"/><text class="d-lab" x="406" y="260" text-anchor="middle">finds</text>
<path class="d-edge acc" d="M230,268 H182" marker-end="url(#parse-d2-ah)"/><text class="d-lab" x="206" y="260" text-anchor="middle">returns</text>
<!-- row 3 -->
<rect class="d-box g5" x="30" y="360" width="150" height="60" rx="14"/><text class="d-t" x="105" y="386" text-anchor="middle">Planner</text><text class="d-s" x="105" y="406" text-anchor="middle">gets the Query</text>
<path class="d-edge acc" d="M105,306 V358" marker-end="url(#parse-d2-ah)"/><text class="d-lab" x="105" y="338" text-anchor="middle">hands off</text>
<rect class="d-box g5" x="300" y="360" width="170" height="60" rx="14"/>
<g transform="translate(308,370) scale(.7)"><path class="d-fillpaper" d="M5,9 V31 C5,36 35,36 35,31 V9"/><ellipse class="d-fillpaper" cx="20" cy="9" rx="15" ry="5"/><path class="d-lineacc" d="M5,20 C5,25 35,25 35,20"/></g>
<text class="d-t" x="350" y="396">Catalogs</text>
<path class="d-edge dash" d="M340,306 V358" marker-end="url(#parse-d2-ah)"/><text class="d-lab" x="340" y="338" text-anchor="middle">reads</text>
<path class="d-edge dash" d="M450,306 V358" marker-end="url(#parse-d2-ah)"/><text class="d-lab" x="450" y="338" text-anchor="middle">opens</text>
<rect class="d-blob2" x="530" y="360" width="250" height="60" rx="14"/>
<text class="d-s" x="655" y="383" text-anchor="middle">Example query</text><text class="d-t" x="655" y="404" text-anchor="middle">SELECT price FROM items</text>
<!-- badges -->
<g><circle class="d-badge" cx="30" cy="60" r="11"/><text class="d-bt" x="30" y="64">1</text></g>
<g><circle class="d-badge" cx="230" cy="60" r="11"/><text class="d-bt" x="230" y="64">2</text></g>
<g><circle class="d-badge" cx="430" cy="60" r="11"/><text class="d-bt" x="430" y="64">3</text></g>
<g><circle class="d-badge" cx="630" cy="60" r="11"/><text class="d-bt" x="630" y="64">4</text></g>
<g><circle class="d-badge" cx="630" cy="230" r="11"/><text class="d-bt" x="630" y="234">5</text></g>
<g><circle class="d-badge" cx="430" cy="230" r="11"/><text class="d-bt" x="430" y="234">6</text></g>
<g><circle class="d-badge" cx="230" cy="230" r="11"/><text class="d-bt" x="230" y="234">7</text></g>
<g><circle class="d-badge" cx="30" cy="230" r="11"/><text class="d-bt" x="30" y="234">8</text></g>
<g><circle class="d-badge" cx="30" cy="360" r="11"/><text class="d-bt" x="30" y="364">9</text></g>
</svg>
