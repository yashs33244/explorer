<svg class="hd" viewBox="0 0 800 430" role="img" aria-label="Lifecycle of an INSERT of a big row through heap code, TOAST, the buffer manager and the data file" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="storage-d2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs>
<rect class="d-blob" x="15" y="15" width="770" height="180" rx="36"/>
<rect class="d-blob" x="15" y="235" width="770" height="180" rx="36"/>
<text class="d-t" x="400" y="40" text-anchor="middle">Row prepared in heap code</text>
<text class="d-t" x="400" y="260" text-anchor="middle">Page found in memory or read from disk</text>
<!-- row 1 -->
<rect class="d-box g1" x="30" y="60" width="130" height="112" rx="14"/>
<g transform="translate(75,64) scale(0.9)"><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37 M8,8 L11.5,11.5 M28.5,28.5 L32,32 M8,32 L11.5,28.5 M28.5,11.5 L32,8"/></g>
<text class="d-t" x="95" y="120" text-anchor="middle">Insert a row</text><text class="d-s" x="95" y="140" text-anchor="middle">heap_insert</text><text class="d-s" x="95" y="157" text-anchor="middle">heapam.c</text>
<rect class="d-box g1" x="233" y="60" width="130" height="112" rx="14"/>
<g transform="translate(278,64) scale(0.9)"><path class="d-fillpaper" d="M8,3 H25 L33,11 V37 H8 Z"/><path class="d-line" d="M25,3 V11 H33"/><path class="d-lineacc" d="M13,20 H28 M13,26 H28 M13,32 H22"/></g>
<text class="d-t" x="298" y="120" text-anchor="middle">TOAST big values</text><text class="d-s" x="298" y="140" text-anchor="middle">compress or slice</text><text class="d-s" x="298" y="157" text-anchor="middle">heaptoast.c</text>
<rect class="d-box g1" x="436" y="60" width="130" height="112" rx="14"/>
<g transform="translate(481,64) scale(0.9)"><rect class="d-fillpaper" x="5" y="4" width="30" height="32" rx="3"/><path class="d-lineacc" d="M5,12 H35"/><rect class="d-fillacc" x="10" y="17" width="20" height="4" rx="1"/><rect class="d-fillacc" x="10" y="24" width="14" height="4" rx="1"/></g>
<text class="d-t" x="501" y="120" text-anchor="middle">Find a page</text><text class="d-s" x="501" y="140" text-anchor="middle">free space map</text><text class="d-s" x="501" y="157" text-anchor="middle">hio.c</text>
<rect class="d-box g2" x="639" y="60" width="130" height="112" rx="14"/>
<g transform="translate(684,64) scale(0.9)"><rect class="d-fillpaper" x="7" y="17" width="26" height="19" rx="4"/><path class="d-line" d="M12,17 V12 C12,3 28,3 28,12 V17"/><circle class="d-fillacc" cx="20" cy="26" r="2.6"/></g>
<text class="d-t" x="704" y="120" text-anchor="middle">Pin the page</text><text class="d-s" x="704" y="140" text-anchor="middle">ReadBuffer_common</text><text class="d-s" x="704" y="157" text-anchor="middle">bufmgr.c</text>
<!-- row 2 right to left -->
<rect class="d-box g4" x="639" y="280" width="130" height="112" rx="14"/>
<g transform="translate(684,284) scale(0.9)"><circle class="d-fillpaper" cx="20" cy="20" r="15"/><path class="d-lineacc" d="M20,10 V20 L27,24"/></g>
<text class="d-t" x="704" y="340" text-anchor="middle">Pick a victim</text><text class="d-s" x="704" y="360" text-anchor="middle">StrategyGetBuffer</text><text class="d-s" x="704" y="377" text-anchor="middle">freelist.c</text>
<rect class="d-box g5" x="436" y="280" width="130" height="112" rx="14"/>
<g transform="translate(481,284) scale(0.9)"><rect class="d-fillpaper" x="4" y="4" width="32" height="10" rx="3"/><rect class="d-fillpaper" x="4" y="16" width="32" height="10" rx="3"/><rect class="d-fillpaper" x="4" y="28" width="32" height="9" rx="3"/><circle class="d-fillacc" cx="10" cy="9" r="1.8"/><circle class="d-fillacc" cx="10" cy="21" r="1.8"/><circle class="d-fillacc" cx="10" cy="32.5" r="1.8"/></g>
<text class="d-t" x="501" y="340" text-anchor="middle">Read 8kB block</text><text class="d-s" x="501" y="360" text-anchor="middle">mdreadv</text><text class="d-s" x="501" y="377" text-anchor="middle">md.c</text>
<rect class="d-box g1" x="233" y="280" width="130" height="112" rx="14"/>
<g transform="translate(278,284) scale(0.9)"><rect class="d-fillpaper" x="5" y="4" width="30" height="32" rx="3"/><path class="d-lineacc" d="M5,12 H35"/><rect class="d-fillacc" x="10" y="17" width="20" height="4" rx="1"/><rect class="d-fillacc" x="10" y="24" width="14" height="4" rx="1"/></g>
<text class="d-t" x="298" y="340" text-anchor="middle">Add the tuple</text><text class="d-s" x="298" y="360" text-anchor="middle">PageAddItemExtended</text><text class="d-s" x="298" y="377" text-anchor="middle">then dirty + WAL</text>
<rect class="d-box g3" x="30" y="280" width="130" height="112" rx="14"/>
<g transform="translate(75,284) scale(0.9)"><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37 M8,8 L11.5,11.5 M28.5,28.5 L32,32 M8,32 L11.5,28.5 M28.5,11.5 L32,8"/></g>
<text class="d-t" x="95" y="340" text-anchor="middle">Clean up later</text><text class="d-s" x="95" y="360" text-anchor="middle">prune and VACUUM</text><text class="d-s" x="95" y="377" text-anchor="middle">pruneheap.c</text>
<!-- arrows -->
<path class="d-edge acc" d="M160,116 L233,116" marker-end="url(#storage-d2-ah)"/><text class="d-lab" x="197" y="108" text-anchor="middle">big row?</text>
<path class="d-edge acc" d="M363,116 L436,116" marker-end="url(#storage-d2-ah)"/><text class="d-lab" x="400" y="108" text-anchor="middle">small row</text>
<path class="d-edge acc" d="M566,116 L639,116" marker-end="url(#storage-d2-ah)"/><text class="d-lab" x="602" y="108" text-anchor="middle">block no.</text>
<path class="d-edge acc" d="M704,172 L704,280" marker-end="url(#storage-d2-ah)"/><text class="d-lab" x="712" y="222">cache miss</text>
<path class="d-edge acc" d="M639,336 L566,336" marker-end="url(#storage-d2-ah)"/><text class="d-lab" x="602" y="328" text-anchor="middle">free slot</text>
<path class="d-edge acc" d="M436,336 L363,336" marker-end="url(#storage-d2-ah)"/><text class="d-lab" x="400" y="328" text-anchor="middle">page ready</text>
<path class="d-edge dash" d="M233,336 L160,336" marker-end="url(#storage-d2-ah)"/><text class="d-lab" x="197" y="328" text-anchor="middle">later</text>
