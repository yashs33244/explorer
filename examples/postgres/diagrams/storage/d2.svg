<g><circle class="d-badge" cx="30" cy="60" r="11"/><text class="d-bt" x="30" y="64">1</text></g>
<g><circle class="d-badge" cx="233" cy="60" r="11"/><text class="d-bt" x="233" y="64">2</text></g>
<g><circle class="d-badge" cx="436" cy="60" r="11"/><text class="d-bt" x="436" y="64">3</text></g>
<g><circle class="d-badge" cx="639" cy="60" r="11"/><text class="d-bt" x="639" y="64">4</text></g>
<g><circle class="d-badge" cx="639" cy="280" r="11"/><text class="d-bt" x="639" y="284">5</text></g>
<g><circle class="d-badge" cx="436" cy="280" r="11"/><text class="d-bt" x="436" y="284">6</text></g>
<g><circle class="d-badge" cx="233" cy="280" r="11"/><text class="d-bt" x="233" y="284">7</text></g>
