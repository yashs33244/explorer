<svg class="hd" viewBox="0 0 800 572" role="img" aria-label="Lifecycle of one commit: backend flushes WAL, walsender sends it, walreceiver fsyncs it, startup process redoes it, a read-only client sees the row, and a reply goes back" xmlns="http://www.w3.org/2000/svg"><defs><marker id="replicas-d2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs><rect class="d-blob" x="4" y="6" width="310" height="562" rx="36"/><text class="d-t" x="18" y="26" text-anchor="start">Primary server</text><rect class="d-blob" x="318" y="6" width="478" height="562" rx="36"/><text class="d-t" x="332" y="26" text-anchor="start">Standby server</text><path class="d-edge dash" d="M78,84 V560" opacity="0.5"/><path class="d-edge dash" d="M236,84 V560" opacity="0.5"/><path class="d-edge dash" d="M394,84 V560" opacity="0.5"/><path class="d-edge dash" d="M552,84 V560" opacity="0.5"/><path class="d-edge dash" d="M710,84 V560" opacity="0.5"/><rect class="d-box g0" x="10.0" y="40" width="136" height="36" rx="12"/><g transform="translate(18.0,46) scale(0.6)"><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37 M8,8 L11.5,11.5 M28.5,28.5 L32,32 M8,32 L11.5,28.5 M28.5,11.5 L32,8"/></g><text class="d-t" x="46.0" y="63" text-anchor="start">Backend</text><rect class="d-box g0" x="168.0" y="40" width="136" height="36" rx="12"/><g transform="translate(176.0,46) scale(0.6)"><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37 M8,8 L11.5,11.5 M28.5,28.5 L32,32 M8,32 L11.5,28.5 M28.5,11.5 L32,8"/></g><text class="d-t" x="204.0" y="63" text-anchor="start">walsender</text><rect class="d-box g0" x="326.0" y="40" width="136" height="36" rx="12"/><g transform="translate(334.0,46) scale(0.6)"><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37 M8,8 L11.5,11.5 M28.5,28.5 L32,32 M8,32 L11.5,28.5 M28.5,11.5 L32,8"/></g><text class="d-t" x="362.0" y="63" text-anchor="start">walreceiver</text><rect class="d-box g0" x="484.0" y="40" width="136" height="36" rx="12"/><g transform="translate(492.0,46) scale(0.6)"><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37 M8,8 L11.5,11.5 M28.5,28.5 L32,32 M8,32 L11.5,28.5 M28.5,11.5 L32,8"/></g><text class="d-t" x="520.0" y="63" text-anchor="start">startup</text><rect class="d-box g0" x="642.0" y="40" width="136" height="36" rx="12"/><g transform="translate(650.0,46) scale(0.6)"><circle class="d-line" cx="20" cy="12" r="7"/><path class="d-line" d="M6,36 C6,25 34,25 34,36 Z"/></g><text class="d-t" x="678.0" y="63" text-anchor="start">Client query</text><rect class="d-box g2" x="10.0" y="100" width="136" height="46" rx="12"/><text class="d-t" x="78" y="119" text-anchor="middle">COMMIT</text><text class="d-s" x="78" y="136" text-anchor="middle">WAL flushed</text><circle class="d-badge" cx="14.0" cy="102" r="11"/><text class="d-bt" x="14.0" y="106">1</text><rect class="d-box g1" x="168.0" y="166" width="136" height="46" rx="12"/><text class="d-t" x="236" y="185" text-anchor="middle">Reads new WAL</text><text class="d-s" x="236" y="202" text-anchor="middle">XLogSendPhysical</text><circle class="d-badge" cx="172.0" cy="168" r="11"/><text class="d-bt" x="172.0" y="172">2</text><rect class="d-box g1" x="326.0" y="232" width="136" height="46" rx="12"/><text class="d-t" x="394" y="251" text-anchor="middle">Writes + fsyncs</text><text class="d-s" x="394" y="268" text-anchor="middle">XLogWalRcvFlush</text><circle class="d-badge" cx="330.0" cy="234" r="11"/><text class="d-bt" x="330.0" y="238">3</text><rect class="d-box g1" x="484.0" y="298" width="136" height="46" rx="12"/><text class="d-t" x="552" y="317" text-anchor="middle">Redoes record</text><text class="d-s" x="552" y="334" text-anchor="middle">heap_redo</text><circle class="d-badge" cx="488.0" cy="300" r="11"/><text class="d-bt" x="488.0" y="304">4</text><rect class="d-box g0" x="642.0" y="364" width="136" height="46" rx="12"/><text class="d-t" x="710" y="383" text-anchor="middle">SELECT sees row</text><text class="d-s" x="710" y="400" text-anchor="middle">read-only snapshot</text><circle class="d-badge" cx="646.0" cy="366" r="11"/><text class="d-bt" x="646.0" y="370">5</text><rect class="d-box g1" x="326.0" y="430" width="136" height="46" rx="12"/><text class="d-t" x="394" y="449" text-anchor="middle">Sends reply</text><text class="d-s" x="394" y="466" text-anchor="middle">XLogWalRcvSendReply</text><circle class="d-badge" cx="330.0" cy="432" r="11"/><text class="d-bt" x="330.0" y="436">6</text><rect class="d-box g2" x="168.0" y="496" width="136" height="46" rx="12"/><text class="d-t" x="236" y="515" text-anchor="middle">Gets reply</text><text class="d-s" x="236" y="532" text-anchor="middle">pg_stat_replication</text><circle class="d-badge" cx="172.0" cy="498" r="11"/><text class="d-bt" x="172.0" y="502">7</text><path class="d-edge acc" d="M146.0,123 H236 V164" marker-end="url(#replicas-d2-ah)"/><text class="d-lab" x="191.0" y="117" text-anchor="middle">wakes</text><path class="d-edge acc" d="M304.0,189 H394 V230" marker-end="url(#replicas-d2-ah)"/><text class="d-lab" x="349.0" y="183" text-anchor="middle">sends WAL</text><path class="d-edge acc" d="M462.0,255 H552 V296" marker-end="url(#replicas-d2-ah)"/><text class="d-lab" x="507.0" y="249" text-anchor="middle">wakes</text><path class="d-edge acc" d="M620.0,321 H710 V362" marker-end="url(#replicas-d2-ah)"/><text class="d-lab" x="665.0" y="315" text-anchor="middle">row visible</text><path class="d-edge dash" d="M394,280 V428" marker-end="url(#replicas-d2-ah)"/><text class="d-lab" x="402" y="360" text-anchor="start">after fsync</text><path class="d-edge acc" d="M326.0,453 H236 V494" marker-end="url(#replicas-d2-ah)"/><text class="d-lab" x="281.0" y="447" text-anchor="middle">LSNs</text></svg>