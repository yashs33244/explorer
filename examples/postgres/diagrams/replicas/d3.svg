<svg class="hd" viewBox="0 0 800 536" role="img" aria-label="Anatomy of a standby: the files in its data directory, the w message the walsender sends, and the r reply the walreceiver sends back" xmlns="http://www.w3.org/2000/svg"><defs><marker id="replicas-d3-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs><rect class="d-blob" x="10" y="10" width="385" height="516" rx="36"/><text class="d-t" x="26" y="34" text-anchor="start">Standby data directory</text><rect class="d-blob" x="405" y="10" width="385" height="516" rx="36"/><rect class="d-box g1" x="28" y="48" width="340" height="32" rx="10"/><text class="d-t" x="40" y="69" text-anchor="start">replica/</text><path class="d-line" d="M40,80 V306 M40,125 H54 M40,185 H54 M40,245 H54 M40,306 H54"/><rect class="d-box g2" x="54" y="100" width="314" height="50" rx="10"/><text class="d-t" x="66" y="120" text-anchor="start">standby.signal</text><text class="d-s" x="66" y="138" text-anchor="start">empty file, stay in recovery</text><circle class="d-badge" cx="364" cy="102" r="11"/><text class="d-bt" x="364" y="106">1</text><rect class="d-box g2" x="54" y="160" width="314" height="50" rx="10"/><text class="d-t" x="66" y="180" text-anchor="start">backup_label</text><text class="d-s" x="66" y="198" text-anchor="start">START WAL LOCATION, timeline</text><circle class="d-badge" cx="364" cy="162" r="11"/><text class="d-bt" x="364" y="166">2</text><rect class="d-box g2" x="54" y="220" width="314" height="50" rx="10"/><text class="d-t" x="66" y="240" text-anchor="start">postgresql.auto.conf</text><text class="d-s" x="66" y="258" text-anchor="start">holds primary_conninfo</text><circle class="d-badge" cx="364" cy="222" r="11"/><text class="d-bt" x="364" y="226">3</text><rect class="d-box g2" x="54" y="280" width="314" height="50" rx="10"/><text class="d-t" x="66" y="300" text-anchor="start">pg_wal/</text><text class="d-s" x="66" y="318" text-anchor="start">WAL the walreceiver writes</text><circle class="d-badge" cx="364" cy="282" r="11"/><text class="d-bt" x="364" y="286">4</text><path class="d-line" d="M68,330 V398 M68,361 H82 M68,421 H82"/><rect class="d-box g3" x="82" y="346" width="286" height="50" rx="10"/><text class="d-t" x="94" y="366" text-anchor="start">000000010000000000000003</text><text class="d-s" x="94" y="384" text-anchor="start">WAL segment, timeline 1</text><rect class="d-box g3" x="82" y="406" width="286" height="50" rx="10"/><text class="d-t" x="94" y="426" text-anchor="start">00000002.history</text><text class="d-s" x="94" y="444" text-anchor="start">written at promote</text><circle class="d-badge" cx="425" cy="31" r="11"/><text class="d-bt" x="425" y="35">5</text><text class="d-t" x="444" y="36" text-anchor="start">'w' message: primary to standby</text><rect class="d-box g1" x="423" y="48" width="352" height="34" rx="8"/><text class="d-t" x="435" y="70" text-anchor="start">'w'</text><text class="d-s" x="763" y="70" text-anchor="end">1 byte, WAL data</text><rect class="d-box g1" x="423" y="86" width="352" height="34" rx="8"/><text class="d-t" x="435" y="108" text-anchor="start">dataStart</text><text class="d-s" x="763" y="108" text-anchor="end">8 bytes, first LSN</text><rect class="d-box g1" x="423" y="124" width="352" height="34" rx="8"/><text class="d-t" x="435" y="146" text-anchor="start">walEnd</text><text class="d-s" x="763" y="146" text-anchor="end">8 bytes, primary end LSN</text><rect class="d-box g1" x="423" y="162" width="352" height="34" rx="8"/><text class="d-t" x="435" y="184" text-anchor="start">sendTime</text><text class="d-s" x="763" y="184" text-anchor="end">8 bytes, clock</text><rect class="d-box g1" x="423" y="200" width="352" height="34" rx="8"/><text class="d-t" x="435" y="222" text-anchor="start">WAL bytes</text><text class="d-s" x="763" y="222" text-anchor="end">the records to redo</text><circle class="d-badge" cx="425" cy="263" r="11"/><text class="d-bt" x="425" y="267">6</text><text class="d-t" x="444" y="268" text-anchor="start">'r' message: standby to primary</text><rect class="d-box g0" x="423" y="280" width="352" height="34" rx="8"/><text class="d-t" x="435" y="302" text-anchor="start">'r'</text><text class="d-s" x="763" y="302" text-anchor="end">1 byte, status update</text><rect class="d-box g0" x="423" y="318" width="352" height="34" rx="8"/><text class="d-t" x="435" y="340" text-anchor="start">writePtr</text><text class="d-s" x="763" y="340" text-anchor="end">8 bytes, received LSN</text><rect class="d-box g0" x="423" y="356" width="352" height="34" rx="8"/><text class="d-t" x="435" y="378" text-anchor="start">flushPtr</text><text class="d-s" x="763" y="378" text-anchor="end">8 bytes, fsynced LSN</text><rect class="d-box g0" x="423" y="394" width="352" height="34" rx="8"/><text class="d-t" x="435" y="416" text-anchor="start">applyPtr</text><text class="d-s" x="763" y="416" text-anchor="end">8 bytes, replayed LSN</text><rect class="d-box g0" x="423" y="432" width="352" height="34" rx="8"/><text class="d-t" x="435" y="454" text-anchor="start">sendTime</text><text class="d-s" x="763" y="454" text-anchor="end">8 bytes, clock</text><rect class="d-box g0" x="423" y="470" width="352" height="34" rx="8"/><text class="d-t" x="435" y="492" text-anchor="start">replyRequested</text><text class="d-s" x="763" y="492" text-anchor="end">1 byte, 0 or 1</text></svg>