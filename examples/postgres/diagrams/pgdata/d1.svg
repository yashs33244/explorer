5 L32,32 M8,32 L11.5,28.5 M28.5,11.5 L32,8"/></g><text class="d-t" x="100.0" y="247.0" text-anchor="start">startup process</text><text class="d-s" x="100.0" y="265.0" text-anchor="start">forked by postmaster</text><rect class="d-box g2" x="50" y="304" width="220" height="52" rx="14"/><g transform="translate(60,314.0) scale(0.8)"><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37 M8,8 L11.5,11.5 M28.5,28.5 L32,32 M8,32 L11.5,28.5 M28.5,11.5 L32,8"/></g><text class="d-t" x="100.0" y="327.0" text-anchor="start">checkpointer</text><text class="d-s" x="100.0" y="345.0" text-anchor="start">background writer</text><rect class="d-box g3" x="50" y="444" width="220" height="52" rx="14"/><g transform="translate(60,454.0) scale(0.8)"><circle class="d-line" cx="20" cy="12" r="7"/><path class="d-line" d="M6,36 C6,25 34,25 34,36 Z"/></g><text class="d-t" x="100.0" y="467.0" text-anchor="start">backend process</text><text class="d-s" x="100.0" y="485.0" text-anchor="start">one per client</text><rect class="d-box g0" x="480" y="64" width="270" height="52" rx="14"/><g transform="translate(490,74.0) scale(0.8)"><circle class="d-fillpaper" cx="20" cy="20" r="9"/><circle class="d-lineacc" cx="20" cy="20" r="3.5"/><path class="d-line" d="M20,3 V8 M20,32 V37 M3,20 H8 M32,20 H37 M8,8 L11.5,11.5 M28.5,28.5 L32,32 M8,32 L11.5,28.5 M28.5,11.5 L32,8"/></g><text class="d-t" x="530.0" y="87.0" text-anchor="start">config files</text><text class="d-s" x="530.0" y="105.0" text-anchor="start">postgresql.conf, pg_hba.conf</text><rect class="d-box g4" x="480" y="144" width="270" height="52" rx="14"/><g transform="translate(490,154.0) scale(0.8)"><rect class="d-fillpaper" x="7" y="17" width="26" height="19" rx="4"/><path class="d-line" d="M12,17 V12 C12,3 28,3 28,12 V17"/><circle class="d-fillacc" cx="20" cy="26" r="2.6"/></g><text class="d-t" x="530.0" y="167.0" text-anchor="start">postmaster.pid</text><text class="d-s" x="530.0" y="185.0" text-anchor="start">the lock file</text><rect class="d-box g4" x="480" y="224" width="270" height="52" rx="14"/><g transform="translate(490,234.0) scale(0.8)"><path class="d-fillpaper" d="M5,9 V31 C5,36 35,36 35,31 V9"/><ellipse class="d-fillpaper" cx="20" cy="9" rx="15" ry="5"/><path class="d-lineacc" d="M5,20 C5,25 35,25 35,20"/></g><text class="d-t" x="530.0" y="247.0" text-anchor="start">global/</text><text class="d-s" x="530.0" y="265.0" text-anchor="start">pg_control, shared catalogs</text><rect class="d-box g1" x="480" y="304" width="270" height="52" rx="14"/><g transform="translate(490,314.0) scale(0.8)"><rect class="d-fillpaper" x="5" y="4" width="30" height="32" rx="3"/><path class="d-lineacc" d="M5,12 H35"/><rect class="d-fillacc" x="10" y="17" width="20" height="4" rx="1"/><rect class="d-fillacc" x="10" y="24" width="14" height="4" rx="1"/></g><text class="d-t" x="530.0" y="327.0" text-anchor="start">base/&lt;db oid&gt;/</text><text class="d-s" x="530.0" y="345.0" text-anchor="start">table and index files</text><rect class="d-box g2" x="480" y="374" width="270" height="52" rx="14"/><g transform="translate(490,384.0) scale(0.8)"><rect class="d-fillpaper" x="6" y="4" width="28" height="32" rx="3"/><path class="d-line" d="M12,4 V36"/><path class="d-lineacc" d="M17,12 H29 M17,19 H29 M17,26 H25"/></g><text class="d-t" x="530.0" y="397.0" text-anchor="start">pg_wal/</text><text class="d-s" x="530.0" y="415.0" text-anchor="start">16MB WAL segments</text><rect class="d-box g2" x="480" y="444" width="270" height="52" rx="14"/><g transform="translate(490,454.0) scale(0.8)"><circle class="d-fillpaper" cx="20" cy="20" r="15"/><path class="d-lineacc" d="M20,10 V20 L27,24"/></g><text class="d-t" x="530.0" y="467.0" text-anchor="start">pg_xact/</text><text class="d-s" x="530.0" y="485.0" text-anchor="start">commit status (SLRU)</text><rect class="d-box g5" x="480" y="514" width="270" height="52" rx="14"/><g transform="translate(490,524.0) scale(0.8)"><path class="d-fillpaper" d="M8,3 H25 L33,11 V37 H8 Z"/><path class="d-line" d="M25,3 V11 H33"/><path class="d-lineacc" d="M13,20 H28 M13,26 H28 M13,32 H22"/></g><text class="d-t" x="530.0" y="537.0" text-anchor="start">base/pgsql_tmp/</text><text class="d-s" x="530.0" y="555.0" text-anchor="start">spill files for big sorts</text><path class="d-edge acc" d="M270,90 L480,90" marker-end="url(#pgdata-d1-ah)"/><text class="d-lab" x="375" y="82" text-anchor="middle">copies templates</text><path class="d-edge acc" d="M270,170 L480,170" marker-end="url(#pgdata-d1-ah)"/><text class="d-lab" x="375" y="162" text-anchor="middle">takes the lock</text><path class="d-edge acc" d="M270,250 L480,250" marker-end="url(#pgdata-d1-ah)"/><text class="d-lab" x="375" y="242" text-anchor="middle">reads pg_control</text><path class="d-edge" d="M270,330 C320,330 320,266 370,266 L480,266" marker-end="url(#pgdata-d1-ah)"/><text class="d-lab" x="425" y="283" text-anchor="middle">updates pg_control</text><path class="d-edge acc" d="M270,330 C320,330 320,322 370,322 L480,322" marker-end="url(#pgdata-d1-ah)"/><text class="d-lab" x="420" y="314" text-anchor="middle">flushes dirty pages</text><path class="d-edge acc" d="M270,470 C320,470 320,338 370,338 L480,338" marker-end="url(#pgdata-d1-ah)"/><text class="d-lab" x="418" y="356" text-anchor="middle">reads, writes pages</text><path class="d-edge acc" d="M270,470 C330,470 330,400 390,400 L480,400" marker-end="url(#pgdata-d1-ah)"/><text class="d-lab" x="437" y="392" text-anchor="middle">appends records</text><path class="d-edge acc" d="M270,470 L480,470" marker-end="url(#pgdata-d1-ah)"/><text class="d-lab" x="400" y="462" text-anchor="middle">marks commit</text><path class="d-edge acc" d="M270,470 C330,470 330,540 390,540 L480,540" marker-end="url(#pgdata-d1-ah)"/><text class="d-lab" x="437" y="532" text-anchor="middle">spills sorts</text><path class="d-edge" d="M160,196 L160,224" marker-end="url(#pgdata-d1-ah)"/><t