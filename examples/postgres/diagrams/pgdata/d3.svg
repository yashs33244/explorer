<svg class="hd" viewBox="0 0 800 610" role="img" aria-label="Annotated directory tree of a PostgreSQL data directory" xmlns="http://www.w3.org/2000/svg"><defs><marker id="pgdata-d3-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs><rect class="d-blob" x="20" y="20" width="760" height="570" rx="36"/><rect class="d-box g5" x="50" y="44" width="200" height="26" rx="9"/><text class="d-m" x="60" y="61" text-anchor="start">PGDATA/</text><text class="d-s" x="310" y="61" text-anchor="start">the one folder the server owns</text><rect class="d-box g0" x="50" y="76" width="200" height="26" rx="9"/><text class="d-m" x="60" y="93" text-anchor="start">PG_VERSION</text><text class="d-s" x="310" y="93" text-anchor="start">major version number</text><path class="d-line" d="M36,89 H50"/><rect class="d-box g0" x="50" y="108" width="200" height="26" rx="9"/><text class="d-m" x="60" y="125" text-anchor="start">postgresql.conf</text><text class="d-s" x="310" y="125" text-anchor="start">settings you edit</text><path class="d-line" d="M36,121 H50"/><rect class="d-box g0" x="50" y="140" width="200" height="26" rx="9"/><text class="d-m" x="60" y="157" text-anchor="start">postgresql.auto.conf</text><text class="d-s" x="310" y="157" text-anchor="start">ALTER SYSTEM writes here</text><path class="d-line" d="M36,153 H50"/><rect class="d-box g0" x="50" y="172" width="200" height="26" rx="9"/><text class="d-m" x="60" y="189" text-anchor="start">pg_hba.conf</text><text class="d-s" x="310" y="189" text-anchor="start">who may connect</text><path class="d-line" d="M36,185 H50"/><rect class="d-box g4" x="50" y="204" width="200" height="26" rx="9"/><text class="d-m" x="60" y="221" text-anchor="start">postmaster.pid</text><text class="d-s" x="310" y="221" text-anchor="start">lock file, exists while running</text><path class="d-line" d="M36,217 H50"/><rect class="d-box g4" x="50" y="236" width="200" height="26" rx="9"/><text class="d-m" x="60" y="253" text-anchor="start">global/</text><text class="d-s" x="310" y="253" text-anchor="start">shared catalogs and pg_control</text><path class="d-line" d="M36,249 H50"/><rect class="d-box g1" x="50" y="268" width="200" height="26" rx="9"/><text class="d-m" x="60" y="285" text-anchor="start">base/</text><text class="d-s" x="310" y="285" text-anchor="start">one sub-folder per database</text><path class="d-line" d="M36,281 H50"/><rect class="d-box g1" x="74" y="300" width="176" height="26" rx="9"/><text class="d-m" x="84" y="317" text-anchor="start">5/</text><text class="d-s" x="310" y="317" text-anchor="start">database oid (5 is postgres)</text><path class="d-line" d="M62,313 H74"/><rect class="d-box g1" x="98" y="332" width="180" height="26" rx="9"/><text class="d-m" x="108" y="349" text-anchor="start">16444</text><text class="d-s" x="310" y="349" text-anchor="start">main fork: the table, named by relfilenode</text><path class="d-line" d="M86,345 H98"/><rect class="d-box g2" x="98" y="364" width="180" height="26" rx="9"/><text class="d-m" x="108" y="381" text-anchor="start">16444_fsm</text><text class="d-s" x="310" y="381" text-anchor="start">free space map fork</text><path class="d-line" d="M86,377 H98"/><rect class="d-box g2" x="98" y="396" width="180" height="26" rx="9"/><text class="d-m" x="108" y="413" text-anchor="start">16444_vm</text><text class="d-s" x="310" y="413" text-anchor="start">visibility map fork</text><path class="d-line" d="M86,409 H98"/><rect class="d-box g1" x="98" y="428" width="180" height="26" rx="9"/><text class="d-m" x="108" y="445" text-anchor="start">16444.1</text><text class="d-s" x="310" y="445" text-anchor="start">next 1GB segment of the same table</text><path class="d-line" d="M86,441 H98"/><rect class="d-box g2" x="50" y="460" width="200" height="26" rx="9"/><text class="d-m" x="60" y="477" text-anchor="start">pg_wal/</text><text class="d-s" x="310" y="477" text-anchor="start">write-ahead log, 16MB segments</text><path class="d-line" d="M36,473 H50"/><rect class="d-box g2" x="50" y="492" width="200" height="26" rx="9"/><text class="d-m" x="60" y="509" text-anchor="start">pg_xact/</text><text class="d-s" x="310" y="509" text-anchor="start">commit status (SLRU files)</text><path class="d-line" d="M36,505 H50"/><rect class="d-box g3" x="50" y="524" width="200" height="26" rx="9"/><text class="d-m" x="60" y="541" text-anchor="start">pg_tblspc/</text><text class="d-s" x="310" y="541" text-anchor="start">links to other tablespaces</text><path class="d-line" d="M36,537 H50"/><path class="d-line" d="M36,70 V537"/><path class="d-line" d="M62,294 V313"/><path class="d-line" d="M86,326 V441"/></svg>