<svg class="hd" viewBox="0 0 800 540" role="img" aria-label="Six steps in the life of a new cluster, from initdb to a clean stop" xmlns="http://www.w3.org/2000/svg"><defs><marker id="pgdata-d2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="d-fillink"/></marker></defs><rect class="d-blob" x="10" y="20" width="780" height="215" rx="36"/><rect class="d-blob2" x="10" y="290" width="780" height="215" rx="36"/><text class="d-s" x="30" y="44" text-anchor="start">Make and start the server</text><text class="d-s" x="30" y="314" text-anchor="start">Use it, then stop it</text><rect class="d-box g0" x="30" y="70" width="200" height="140" rx="14"/><g transform="translate(40,78) scale(1)"><path class="d-fillpaper" d="M8,3 H25 L33,11 V37 H8 Z"/><path class="d-line" d="M25,3 V11 H33"/><path class="d-lineacc" d="M13,20 H28 M13,26 H28 M13,32 H22"/></g><text class="d-t" x="88" y="104" text-anchor="start">initdb</text><circle class="d-badge" cx="206" cy="92" r="11"/><text class="d-bt" x="206" y="96">1</text><text class="d-m" x="44" y="138" text-anchor="start">initdb -D data</text><text class="d-s" x="44" y="176" text-anchor="start">makes the folder tree</text><text class="d-s" x="44" y="192" text-anchor="start">copies config templates</text><rect class="d-box g1" x="300" y="70" width="200" height="140" rx="14"/><g transform="translate(310,78) scale(1)"><rect class="d-fillpaper" x="7" y="17" width="26" height="19" rx="4"/><path class="d-line" d="M12,17 V12 C12,3 28,3 28,12 V17"/><circle class="d-fillacc" cx="20" cy="26" r="2.6"/></g><text class="d-t" x="358" y="104" text-anchor="start">pg_ctl start</text><circle class="d-badge" cx="476" cy="92" r="11"/><text class="d-bt" x="476" y="96">2</text><text class="d-m" x="314" y="138" text-anchor="start">postmaster.pid</text><text class="d-s" x="314" y="176" text-anchor="start">postmaster writes the lock</text><text class="d-s" x="314" y="192" text-anchor="start">status says starting</text><rect class="d-box g4" x="570" y="70" width="200" height="140" rx="14"/><g transform="translate(580,78) scale(1)"><path class="d-fillpaper" d="M5,9 V31 C5,36 35,36 35,31 V9"/><ellipse class="d-fillpaper" cx="20" cy="9" rx="15" ry="5"/><path class="d-lineacc" d="M5,20 C5,25 35,25 35,20"/></g><text class="d-t" x="628" y="104" text-anchor="start">Recovery check</text><circle class="d-badge" cx="746" cy="92" r="11"/><text class="d-bt" x="746" y="96">3</text><text class="d-m" x="584" y="138" text-anchor="start">global/pg_control</text><text class="d-s" x="584" y="176" text-anchor="start">startup process reads it</text><text class="d-s" x="584" y="192" text-anchor="start">replays WAL if needed</text><rect class="d-box g1" x="30" y="340" width="200" height="140" rx="14"/><g transform="translate(40,348) scale(1)"><rect class="d-fillpaper" x="5" y="4" width="30" height="32" rx="3"/><path class="d-lineacc" d="M5,12 H35"/><rect class="d-fillacc" x="10" y="17" width="20" height="4" rx="1"/><rect class="d-fillacc" x="10" y="24" width="14" height="4" rx="1"/></g><text class="d-t" x="88" y="374" text-anchor="start">CREATE TABLE</text><circle class="d-badge" cx="206" cy="362" r="11"/><text class="d-bt" x="206" y="366">4</text><text class="d-m" x="44" y="408" text-anchor="start">base/5/16444</text><text class="d-s" x="44" y="446" text-anchor="start">a new relfilenode file</text><text class="d-s" x="44" y="462" text-anchor="start">rows go in 8kB pages</text><rect class="d-box g2" x="300" y="340" width="200" height="140" rx="14"/><g transform="translate(310,348) scale(1)"><path class="d-fillpaper" d="M8,3 H25 L33,11 V37 H8 Z"/><path class="d-line" d="M25,3 V11 H33"/><path class="d-lineacc" d="M13,20 H28 M13,26 H28 M13,32 H22"/></g><text class="d-t" x="358" y="374" text-anchor="start">VACUUM</text><circle class="d-badge" cx="476" cy="362" r="11"/><text class="d-bt" x="476" y="366">5</text><text class="d-m" x="314" y="408" text-anchor="start">base/5/16444_fsm</text><text class="d-m" x="314" y="425" text-anchor="start">base/5/16444_vm</text><text class="d-s" x="314" y="446" text-anchor="start">adds two extra forks</text><rect class="d-box g5" x="570" y="340" width="200" height="140" rx="14"/><g transform="translate(580,348) scale(1)"><circle class="d-fillpaper" cx="20" cy="20" r="15"/><path class="d-lineacc" d="M20,10 V20 L27,24"/></g><text class="d-t" x="628" y="374" text-anchor="start">pg_ctl stop</text><circle class="d-badge" cx="746" cy="362" r="11"/><text class="d-bt" x="746" y="366">6</text><text class="d-m" x="584" y="408" text-anchor="start">pg_control: shut down</text><text class="d-m" x="584" y="425" text-anchor="start">postmaster.pid removed</text><text class="d-s" x="584" y="446" text-anchor="start">a shutdown checkpoint</text><text class="d-s" x="584" y="462" text-anchor="start">runs first</text><path class="d-edge acc" d="M230,140 L300,140" marker-end="url(#pgdata-d2-ah)"/><text class="d-lab" x="265" y="134" text-anchor="middle">starts</text><path class="d-edge acc" d="M500,140 L570,140" marker-end="url(#pgdata-d2-ah)"/><text class="d-lab" x="535" y="134" text-anchor="middle">forks</text><path class="d-edge acc" d="M670,210 C670,275 130,275 130,340" marker-end="url(#pgdata-d2-ah)"/><text class="d-lab" x="400" y="257" text-anchor="middle">ready for SQL</text><path class="d-edge acc" d="M230,410 L300,410" marker-end="url(#pgdata-d2-ah)"/><text class="d-lab" x="265" y="404" text-anchor="middle">later</text><path class="d-edge acc" d="M500,410 L570,410" marker-end="url(#pgdata-d2-ah)"/><text class="d-lab" x="535" y="404" text-anchor="middle">finally</text></svg>